<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تنخواه</title><style>
:root{
  --bg:#0b1220;--panel:#111827;--card:#1e293b;--card2:#162032;--line:#334155;
  --txt:#e2e8f0;--muted:#94a3b8;--pri:#3b82f6;--pri-hover:#2563eb;
  --ok:#22c55e;--bad:#ef4444;--warn:#f59e0b;
  --shadow:0 8px 32px rgba(0,0,0,.45);--radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tahoma,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100dvh;line-height:1.55}
.app{max-width:920px;margin:0 auto;padding:20px 16px 40px}
.hero{text-align:center;margin-bottom:18px}
.hero .logo{width:52px;height:52px;margin:0 auto 10px;border-radius:14px;background:linear-gradient(145deg,#3b82f6,#1d4ed8);display:grid;place-items:center;font-size:24px;box-shadow:var(--shadow)}
.hero h1{font-size:1.25rem;font-weight:800;color:#f1f5f9}
.hero .sub{font-size:.78rem;color:var(--muted);margin-top:4px}
/* top tabs like screenshot */
.tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px}
.tabs button{background:var(--card);border:1px solid var(--line);color:var(--muted);border-radius:12px;padding:10px 16px;font-size:.8rem;font-weight:700;cursor:pointer;font-family:inherit;min-width:88px}
.tabs button.on,.tabs button:hover{background:var(--pri);color:#fff;border-color:var(--pri)}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
@media(max-width:600px){.kpi{grid-template-columns:1fr}}
.kpi .box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;text-align:center;min-height:72px}
.kpi .box .n{font-size:.95rem;font-weight:700;color:#e2e8f0}
.kpi .box .dot{color:var(--pri);margin-left:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.card h2{font-size:.9rem;color:#93c5fd;margin-bottom:10px;text-align:right}
.card .meta{font-size:.8rem;color:var(--muted);text-align:right;margin-bottom:12px}
.btn{display:block;width:100%;border:none;border-radius:12px;padding:12px;font-weight:700;font-size:.85rem;cursor:pointer;font-family:inherit;margin-bottom:8px;text-align:center}
.btn-p{background:var(--pri);color:#fff}
.btn-p:hover{background:var(--pri-hover)}
.btn-g{background:#334155;color:#e2e8f0}
.btn-b{background:#7f1d1d;color:#fecaca}
.btn-sm{display:inline-block;width:auto;padding:6px 12px;font-size:.75rem;margin:0 4px 0 0}
.panel{display:none}.panel.on{display:block}
label{display:block;font-size:.72rem;color:var(--muted);margin:8px 0 4px;text-align:right}
input,select,textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#0f172a;color:var(--txt);font-family:inherit;font-size:14px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri)}
input.err{border-color:var(--bad)}.field-error{color:#fca5a5;font-size:.68rem;min-height:.9em;text-align:right}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.row{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:.8rem}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:right}
th{color:#93c5fd;font-size:.72rem}
.empty{color:var(--muted);font-size:.85rem;padding:8px 0;text-align:right}
/* header clock - ALWAYS visible dark text on light chip OR light text on dark chip */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.topbar .brand{display:flex;align-items:center;gap:8px}
.topbar .brand span{font-weight:800;font-size:.9rem}
.clock-chip{background:#1e293b;border:1px solid #475569;border-radius:12px;padding:8px 12px;min-width:130px}
.clock-chip div{display:block !important;color:#f1f5f9 !important;font-size:12px !important;font-weight:700 !important;line-height:1.45 !important;visibility:visible !important;opacity:1 !important;height:auto !important;white-space:nowrap}
.clock-chip .j{color:#7dd3fc !important}
.clock-chip .g{color:#94a3b8 !important;direction:ltr;unicode-bidi:isolate;font-size:11px !important}
.clock-chip .c{color:#86efac !important}
.clock-chip .u{color:#fde68a !important}
.mic{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:#fff;cursor:pointer;font-size:16px}
.mic.on{background:#166534;border-color:#22c55e}
.mic.off{background:#7f1d1d;border-color:#f87171}
.side-alerts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.side-alerts button{flex:1;min-width:100px;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:10px;font-size:.75rem;font-weight:700;cursor:pointer;font-family:inherit}
.side-alerts button .b{background:var(--pri);color:#fff;border-radius:999px;padding:1px 7px;font-size:.68rem;margin-right:4px}
.side-alerts button.blink{animation:blink 1s infinite;border-color:var(--warn)}
@keyframes blink{50%{box-shadow:0 0 0 4px rgba(245,158,11,.25)}}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ok);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;opacity:0;transition:.2s;z-index:100}
.toast.show{opacity:1}.toast.err{background:var(--bad)}
.login-mask{position:fixed;inset:0;background:rgba(2,6,23,.92);z-index:300;display:flex;align-items:center;justify-content:center}
.login-box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;width:min(340px,92vw)}
.login-box h2{text-align:center;margin-bottom:12px;color:#93c5fd}
.code-wrap{display:flex;gap:6px}.code-wrap input{flex:1}
.code-btn{width:42px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:#fff;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;max-width:440px;width:100%;max-height:80vh;overflow:auto}
.footer{text-align:center;color:var(--muted);font-size:.72rem;margin-top:16px}
.excel-grid{width:100%;border-collapse:collapse;font-size:.75rem}
.excel-grid th,.excel-grid td{border:1px solid var(--line);padding:4px}
.excel-grid input{border:none;background:transparent;padding:6px;width:100%;color:var(--txt)}
.excel-grid th{background:#0f172a;color:#93c5fd}
.date-wrap{position:relative}
.jcal-pop{position:absolute;z-index:90;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;width:290px;box-shadow:var(--shadow)}
.jcal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.jcal-head button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:#0f172a;color:#fff;cursor:pointer}
.jcal-week,.jcal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.jcal-week span{text-align:center;font-size:.55rem;color:var(--muted)}
.jcal-days button{border:none;background:transparent;color:var(--txt);border-radius:8px;padding:3px;cursor:pointer;font-family:inherit;min-height:40px}
.jcal-days button .jd{display:block;font-size:.75rem;font-weight:700}
.jcal-days button .gd{display:block;font-size:.5rem;color:var(--muted)}
</style></head><body><div class="app"><div class="topbar"><div class="brand"><span>💵 تنخواه</span></div><button type="button" class="mic off" id="btnMic" title="صوتی">🎤</button><div class="clock-chip"><div class="j" id="dtJ">—</div><div class="g" id="dtG">—</div><div class="c" id="dtC">—</div><div class="u" id="activeUser">—</div><div id="fiscalYear" style="font-size:11px;color:#94a3b8">—</div></div></div><div class="hero"><div class="logo">💵</div><h1>تنخواه</h1><p class="sub">localStorage · یکپارچه با سامانه</p></div><div class="tabs"><button type="button" class="on" data-panel="p-dash">داشبورد</button><button type="button" data-panel="p-reg">ثبت</button><button type="button" data-panel="p-list">فهرست</button><button type="button" data-panel="p-rep">گزارش</button><button type="button" data-panel="p-tools">امکانات</button><button type="button" data-panel="p-set">تنظیمات</button></div><div class="side-alerts"><button type="button" id="alertNotes">📝 یادداشت <span class="b">0</span></button><button type="button" id="alertRems">⏰ یادآوری <span class="b">0</span></button><button type="button" id="alertCart">📥 کارتابل <span class="b">0</span></button></div><div class="panel on" id="p-dash"><div class="kpi"><div class="box"><div class="n"><span class="dot">●</span> دوره</div></div><div class="box"><div class="n"><span class="dot">●</span> هزینه</div></div><div class="box"><div class="n"><span class="dot">●</span> شارژ</div></div></div><div class="card"><h2>خلاصه</h2><div class="meta" id="dashMeta">رکورد: ۰</div><button type="button" class="btn btn-p" data-panel="p-list">به‌روزرسانی / فهرست</button><button type="button" class="btn btn-g" id="btnExit">بازگشت به Suite</button></div></div><div class="panel" id="p-reg"><div class="card"><h2>ثبت</h2><p class="empty">دوره · هزینه · شارژ</p><div class="row"><div><label>عنوان *</label><input id="fTitle" data-validate="required"><div class="field-error"></div></div><div><label>کد</label><div class="code-wrap"><input id="fCode" data-code-picker></div></div></div><div class="row"><div><label>تاریخ</label><input id="fDate" class="jdate" data-jdate><div class="field-error"></div></div><div><label>مبلغ</label><input id="fAmount" data-validate="number"><div class="field-error"></div></div></div><label>توضیحات</label><textarea id="fNote" rows="2"></textarea><button type="button" class="btn btn-p" id="btnSave">ذخیره</button><button type="button" class="btn btn-g" id="btnToAcc">ارسال به مخزن حسابداری</button></div></div><div class="panel" id="p-list"><div class="card"><h2>فهرست</h2><input id="fSearch" placeholder="جستجو..." style="margin-bottom:10px"><div id="listBox"></div></div></div><div class="panel" id="p-rep"><div class="card"><h2>گزارش</h2><div id="repBox"></div><button type="button" class="btn btn-g" onclick="window.print()">چاپ</button></div></div><div class="panel" id="p-tools"><div class="card"><h2>امکانات</h2><p class="empty">ورد · اکسل · پاورپوینت · PDF · تصویر</p><input type="file" id="officeFile" accept=".doc,.docx,.xls,.xlsx,.ppt,.pptx,.pdf,image/*"><div id="officePrev" style="margin-top:10px"></div><button type="button" class="btn btn-g" id="btnBackup" style="margin-top:10px">پشتیبان JSON</button><button type="button" class="btn btn-g" id="btnRestoreTrigger">بازیابی</button></div></div><div class="panel" id="p-set"><div class="card"><h2>تنظیمات</h2><label>سال مالی شمسی</label><input id="fyInput"><button type="button" class="btn btn-p" id="btnFy">ذخیره سال مالی</button><h2 style="margin-top:14px">کاربران ماژول</h2><div class="row"><input id="nuUser" placeholder="کاربری"><input id="nuPass" placeholder="رمز"><input id="nuName" placeholder="نام"></div><button type="button" class="btn btn-p" id="btnAddUser">افزودن کاربر</button><div id="usersList"></div></div></div><div class="panel" id="p-notes"><div class="card"><h2>یادداشت (فقط این ماژول)</h2><input id="noteText" placeholder="متن"><button type="button" class="btn btn-p" id="btnAddNote">افزودن</button><div id="notesList"></div></div></div><div class="panel" id="p-rems"><div class="card"><h2>یادآوری (این ماژول)</h2><div class="row"><input id="remText" placeholder="عنوان"><input id="remDate" class="jdate" data-jdate placeholder="تاریخ"></div><button type="button" class="btn btn-p" id="btnAddRem">افزودن</button><button type="button" class="btn btn-g" id="btnRemCart">ارسال یادآوری به کارتابل سراسری</button><div id="remsList"></div></div></div><div class="panel" id="p-cartable"><div class="card"><h2>کارتابل سراسری (کل سیستم)</h2><div class="row"><input id="cartTo" placeholder="گیرنده یا *"><input id="cartMsg" placeholder="پیام"></div><input type="file" id="cartFile"><button type="button" class="btn btn-p" id="btnCartSend">ارسال</button><div id="cartList"></div></div></div><div class="footer">تنخواه</div></div><input type="file" id="restoreFile" accept="application/json" hidden><div class="toast" id="toast"></div><script>(function(g){"use strict";

function render(){if(!pop)return;pop.innerHTML="";var head=document.createElement("div");head.className="jcal-head";head.innerHTML='<button type="button" data-a="py">«</button><button type="button" data-a="pm">‹</button><span>'+JM[vm-1]+' '+toFa(vy)+'</span><button type="button" data-a="nm">›</button><button type="button" data-a="ny">»</button>';var week=document.createElement("div");week.className="jcal-week";JW.forEach(function(w){var s=document.createElement("span");s.textContent=w;week.appendChild(s);});var days=document.createElement("div");days.className="jcal-days";var dim=jMonthLength(vy,vm);var fg=j2g(vy,vm,1);var start=(new Date(fg.gy,fg.gm-1,fg.gd).getDay()+1)%7;for(var i=0;i<start;i++)days.appendChild(document.createElement("button"));for(var d=1;d<=dim;d++){(function(day){var g=j2g(vy,vm,day);var b=document.createElement("button");b.type="button";b.innerHTML='<span class="jd">'+toFa(day)+'</span><span class="gd">'+g.gy+"/"+g.gm+"/"+g.gd+'</span>';b.onclick=function(ev){ev.stopPropagation();input.value=toFa(vy)+"/"+toFa(String(vm).padStart(2,"0"))+"/"+toFa(String(day).padStart(2,"0"));input.dispatchEvent(new Event("input",{bubbles:true}));close();};days.appendChild(b);})(d);}pop.appendChild(head);pop.appendChild(week);pop.appendChild(days);head.querySelectorAll("button").forEach(function(b){b.onclick=function(ev){ev.stopPropagation();var a=b.getAttribute("data-a");if(a==="pm"){vm--;if(vm<1){vm=12;vy--;}}if(a==="nm"){vm++;if(vm>12){vm=1;vy++;}}if(a==="py")vy--;if(a==="ny")vy++;render();};});}
if(!input.closest(".date-wrap")){var dw=document.createElement("div");dw.className="date-wrap";input.parentNode.insertBefore(dw,input);dw.appendChild(input);}
input.addEventListener("focus",open);input.addEventListener("click",open);}
function loadJSON(k,d){try{return JSON.parse(localStorage.getItem(k)||"null")||d;}catch(e){return d;}}
function saveJSON(k,v){localStorage.setItem(k,JSON.stringify(v));}
function playBeep(){try{var c=new(window.AudioContext||window.webkitAudioContext)();var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=660;g.gain.value=0.07;o.start();setTimeout(function(){o.stop();c.close();},180);}catch(e){}}
function updateAlerts(modId){var notes=loadJSON("smart_mod_notes_"+modId,[]);var rems=loadJSON("smart_mod_rem_"+modId,[]);var cart=loadJSON("smart_cartable_v1",{items:[]});var u=getActiveUser(modId);var unread=(cart.items||[]).filter(function(x){return !x.read&&(x.to===u||x.to==="*");}).length;var nb=document.getElementById("alertNotes"),rb=document.getElementById("alertRems"),cb=document.getElementById("alertCart");
if(nb){nb.querySelector(".b").textContent=notes.length;}
if(rb){rb.querySelector(".b").textContent=rems.length;if(rems.length){rb.classList.add("blink");}else rb.classList.remove("blink");}
if(cb){cb.querySelector(".b").textContent=unread;if(unread){cb.classList.add("blink");playBeep();}else cb.classList.remove("blink");}}
function openCodePicker(input,codes){var m=document.createElement("div");m.className="modal open";m.innerHTML='<div class="box"><h3 style="margin-bottom:8px">انتخاب کد</h3><input id="cs" placeholder="جستجو" style="margin-bottom:8px"><div id="cl"></div><button type="button" class="btn btn-g" id="cc">بستن</button></div>';document.body.appendChild(m);
function ren(q){q=(q||"").toLowerCase();var list=(codes||[]).filter(function(c){return !q||(c.code+" "+c.title).toLowerCase().indexOf(q)>=0;});document.getElementById("cl").innerHTML=list.map(function(c){return "<div style=\\"padding:8px;border-bottom:1px solid #334155;cursor:pointer\\" data-c=\\""+c.code+"\\">"+c.code+" — "+c.title+"</div>";}).join("")||"<p class=\\"empty\\">—</p>";
document.getElementById("cl").querySelectorAll("[data-c]").forEach(function(el){el.onclick=function(){input.value=el.getAttribute("data-c");m.remove();};});}
document.getElementById("cs").oninput=function(){ren(this.value);};document.getElementById("cc").onclick=function(){m.remove();};ren("");}
function pushToAccQueue(source,payload,uniqueId){var q=loadJSON("smart_acc_queue_v1",{items:[]});if(uniqueId&&q.items.some(function(x){return x.uniqueId===uniqueId&&!x.posted;}))return false;q.items.push({id:Date.now().toString(36),source:source,uniqueId:uniqueId,payload:payload,at:new Date().toISOString(),posted:false});saveJSON("smart_acc_queue_v1",q);return true;}
function bootShell(opts){opts=opts||{};var modId=opts.modId||"mod";ensureSession(modId);startClock();
var u=document.getElementById("activeUser");if(u)u.textContent=getActiveUser(modId);
var fy=document.getElementById("fiscalYear");if(fy)fy.textContent="سال مالی "+toFa(getFiscalYear());
bindFieldValidation(document);document.querySelectorAll("input.jdate,[data-jdate]").forEach(attachJalaliPicker);initVoice(document.getElementById("btnMic"));
document.querySelectorAll("[data-panel]").forEach(function(b){b.addEventListener("click",function(e){e.preventDefault();var id=b.getAttribute("data-panel");if(id)showPanel(id);});});
document.querySelectorAll("[data-code-picker]").forEach(function(inp){if(inp.parentNode.classList.contains("code-wrap"))return;var w=document.createElement("div");w.className="code-wrap";inp.parentNode.insertBefore(w,inp);w.appendChild(inp);var btn=document.createElement("button");btn.type="button";btn.className="code-btn";btn.textContent="📋";btn.onclick=function(){openCodePicker(inp,opts.codes||[]);};w.appendChild(btn);});
updateAlerts(modId);setInterval(function(){updateAlerts(modId);},20000);
if(document.getElementById("alertNotes"))document.getElementById("alertNotes").onclick=function(){showPanel("p-notes");};
if(document.getElementById("alertRems"))document.getElementById("alertRems").onclick=function(){showPanel("p-rems");};
if(document.getElementById("alertCart"))document.getElementById("alertCart").onclick=function(){showPanel("p-cartable");};
var ex=document.getElementById("btnExit");if(ex)ex.onclick=function(){try{if(opts.onSave)opts.onSave();}catch(e){}location.href=opts.suiteUrl||"index.html";};
}
g.ModuleKit={toFa:toFa,toEn:toEn,bootShell:bootShell,validateForm:validateForm,showPanel:showPanel,getFiscalYear:getFiscalYear,setFiscalYear:setFiscalYear,getActiveUser:getActiveUser,getAuth:getAuth,saveAuth:saveAuth,loadJSON:loadJSON,saveJSON:saveJSON,pushToAccQueue:pushToAccQueue,updateAlerts:updateAlerts,openCodePicker:openCodePicker};
})(window);
</script><script>
document.addEventListener("DOMContentLoaded",function(){
var MOD="petty",KEY="smart_petty_v1",K=ModuleKit;
var CODES=[{code:"1101",title:"صندوق"},{code:"1102",title:"بانک"},{code:"1201",title:"دریافتنی"},{code:"2101",title:"پرداختنی"},{code:"4101",title:"فروش"},{code:"5101",title:"بهای تمام‌شده"}];
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML;}
function toast(m,e){var t=document.getElementById("toast");t.textContent=m;t.classList.toggle("err",!!e);t.classList.add("show");setTimeout(function(){t.classList.remove("show");},2000);}
function load(){try{var d=JSON.parse(localStorage.getItem(KEY)||"null");return d&&Array.isArray(d.items)?d:{items:[]};}catch(e){return {items:[]};}}
function save(d){d.updated=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(d));}
K.bootShell({modId:MOD,codes:CODES,onSave:function(){save(load());},suiteUrl:"index.html"});
function render(){var d=load(),q=(document.getElementById("fSearch").value||"").toLowerCase();
var list=d.items.filter(function(x){return !q||(x.title+" "+(x.code||"")).toLowerCase().indexOf(q)>=0;});
document.getElementById("dashMeta").textContent="رکورد: "+d.items.length;
var box=document.getElementById("listBox");
if(!list.length)box.innerHTML="<p class=\"empty\">موردی نیست</p>";
else{box.innerHTML="<table><thead><tr><th>عنوان</th><th>کد</th><th>تاریخ</th><th></th></tr></thead><tbody>"+list.map(function(x){return "<tr><td>"+esc(x.title)+"</td><td>"+esc(x.code||"")+"</td><td>"+esc(x.date||"")+"</td><td><button type=\"button\" class=\"btn btn-b btn-sm\" data-d=\""+x.id+"\">حذف</button></td></tr>";}).join("")+"</tbody></table>";
box.querySelectorAll("[data-d]").forEach(function(b){b.onclick=function(){var d=load();d.items=d.items.filter(function(x){return x.id!==b.getAttribute("data-d");});save(d);render();};});}
document.getElementById("repBox").innerHTML="<p>تعداد کل: "+d.items.length+"</p>";
renderNotes();renderRems();renderCart();renderUsers();}
document.getElementById("btnSave").onclick=function(){if(!K.validateForm(document.getElementById("p-reg"))){toast("خطای فرم",true);return;}
var d=load();d.items.unshift({id:uid(),title:document.getElementById("fTitle").value.trim(),code:document.getElementById("fCode").value.trim(),date:document.getElementById("fDate").value.trim(),amount:document.getElementById("fAmount").value.trim(),note:document.getElementById("fNote").value.trim(),fiscal:K.getFiscalYear()});save(d);
["fTitle","fCode","fDate","fAmount","fNote"].forEach(function(i){document.getElementById(i).value="";});render();toast("ذخیره شد");};
document.getElementById("btnToAcc").onclick=function(){var d=load();if(!d.items[0]){toast("موردی نیست",true);return;}var x=d.items[0];toast(K.pushToAccQueue(MOD,{title:x.title,amount:x.amount,code:x.code,date:x.date},x.id)?"ارسال به مخزن":"تکراری");};
document.getElementById("fSearch").oninput=render;
document.getElementById("officeFile").onchange=function(e){var f=e.target.files[0];if(!f)return;var u=URL.createObjectURL(f);document.getElementById("officePrev").innerHTML=f.type.indexOf("image")===0?"<img src=\""+u+"\" style=\"max-width:100%;border-radius:8px\">":"<a class=\"btn btn-p\" href=\""+u+"\" download>دانلود "+f.name+"</a>";};
function renderNotes(){var n=K.loadJSON("smart_mod_notes_"+MOD,[]);document.getElementById("notesList").innerHTML=n.map(function(x,i){return "<div style=\"padding:6px 0;border-bottom:1px solid #334155\">"+esc(x.text)+"</div>";}).join("")||"<p class=\"empty\">—</p>";}
document.getElementById("btnAddNote").onclick=function(){var t=document.getElementById("noteText").value.trim();if(!t)return;var n=K.loadJSON("smart_mod_notes_"+MOD,[]);n.unshift({text:t,user:K.getActiveUser(MOD)});K.saveJSON("smart_mod_notes_"+MOD,n);document.getElementById("noteText").value="";renderNotes();K.updateAlerts(MOD);};
function renderRems(){var n=K.loadJSON("smart_mod_rem_"+MOD,[]);document.getElementById("remsList").innerHTML=n.map(function(x){return "<div style=\"padding:6px 0;border-bottom:1px solid #334155\">"+esc(x.text)+" — "+esc(x.date||"")+"</div>";}).join("")||"<p class=\"empty\">—</p>";}
document.getElementById("btnAddRem").onclick=function(){var t=document.getElementById("remText").value.trim(),d=document.getElementById("remDate").value.trim();if(!t)return;var n=K.loadJSON("smart_mod_rem_"+MOD,[]);n.unshift({text:t,date:d});K.saveJSON("smart_mod_rem_"+MOD,n);renderRems();K.updateAlerts(MOD);toast("یادآوری ثبت شد");};
document.getElementById("btnRemCart").onclick=function(){var t=document.getElementById("remText").value.trim()||"یادآوری";var c=K.loadJSON("smart_cartable_v1",{items:[]});c.items.unshift({id:uid(),from:K.getActiveUser(MOD)+"@"+MOD,to:"*",msg:"[یادآوری ماژول] "+t,read:false,at:new Date().toISOString()});K.saveJSON("smart_cartable_v1",c);K.updateAlerts(MOD);toast("به کارتابل سراسری ارسال شد");};
function renderCart(){var c=K.loadJSON("smart_cartable_v1",{items:[]});var u=K.getActiveUser(MOD);document.getElementById("cartList").innerHTML=(c.items||[]).filter(function(x){return x.to===u||x.to==="*"||x.from.indexOf(u)>=0;}).map(function(x){return "<div style=\"padding:8px 0;border-bottom:1px solid #334155\"><b>"+esc(x.from)+"</b>: "+esc(x.msg)+(x.fileName?" ["+esc(x.fileName)+"]":"")+"</div>";}).join("")||"<p class=\"empty\">خالی</p>";}
document.getElementById("btnCartSend").onclick=function(){var c=K.loadJSON("smart_cartable_v1",{items:[]});var f=document.getElementById("cartFile").files[0];var item={id:uid(),from:K.getActiveUser(MOD)+"@"+MOD,to:document.getElementById("cartTo").value.trim()||"*",msg:document.getElementById("cartMsg").value.trim(),fileName:f?f.name:"",read:false,at:new Date().toISOString()};
function done(){c.items.unshift(item);K.saveJSON("smart_cartable_v1",c);renderCart();K.updateAlerts(MOD);toast("ارسال شد");}
if(f){var r=new FileReader();r.onload=function(){item.fileData=r.result;done();};r.readAsDataURL(f);}else done();};
function renderUsers(){var a=K.getAuth(MOD);document.getElementById("usersList").innerHTML="<table><tbody>"+(a.users||[]).map(function(x){return "<tr><td>"+esc(x.user)+"</td><td>"+esc(x.name||"")+"</td></tr>";}).join("")+"</tbody></table>";}
document.getElementById("btnAddUser").onclick=function(){var a=K.getAuth(MOD);a.users.push({user:document.getElementById("nuUser").value.trim(),pass:document.getElementById("nuPass").value,name:document.getElementById("nuName").value.trim()});K.saveAuth(MOD,a);renderUsers();toast("کاربر اضافه شد");};
document.getElementById("btnFy").onclick=function(){var y=parseInt(K.toEn(document.getElementById("fyInput").value),10);if(y){K.setFiscalYear(y);document.getElementById("fiscalYear").textContent="سال مالی "+K.toFa(y);toast("ذخیره شد");}};
document.getElementById("fyInput").value=K.getFiscalYear();
document.getElementById("btnBackup").onclick=function(){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(load(),null,2)],{type:"application/json"}));a.download=KEY+".json";a.click();};
document.getElementById("btnRestoreTrigger").onclick=function(){document.getElementById("restoreFile").click();};
document.getElementById("restoreFile").onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{save(JSON.parse(r.result));render();toast("بازیابی");}catch(err){toast("نامعتبر",true);}};r.readAsText(f);};
render();
});
</script></body></html>
