<!DOCTYPE html>
<html lang="fa" dir="rtl">
<link rel="manifest" href="/smart-secretary/manifest.json">
<link rel="apple-touch-icon" href="/smart-secretary/icon-192.png">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f8fafc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="منشی هوشمند">
<link rel="manifest" href="manifest.json">
<title>منشی هوشمند</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tahoma,"Segoe UI",system-ui,sans-serif;background:#f1f5f9;color:#1e293b;min-height:100vh;padding:12px 10px 60px;line-height:1.5}
.box{max-width:440px;margin:0 auto}
.header{text-align:center;margin-bottom:12px}
.logo{width:48px;height:48px;background:linear-gradient(135deg,#0ea5e9,#6366f1);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 6px;color:#fff}
h1{font-size:1.2rem;color:#0f172a}
.sub{color:#64748b;font-size:.8rem}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:12px;position:sticky;top:0;z-index:20;background:#f1f5f9;padding:6px 0}
.nav button{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:9px 2px;font-size:.75rem;color:#64748b;cursor:pointer}
.nav button.on{background:#0ea5e9;color:#fff;border-color:#0ea5e9}
.panel{display:none}.panel.on{display:block}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card h2{font-size:.92rem;color:#0f172a;margin-bottom:10px}
.btn{display:block;width:100%;text-align:center;padding:11px;border-radius:10px;font-size:.88rem;font-weight:600;border:none;color:#fff;cursor:pointer;margin-bottom:6px}
.btn-b{background:#0ea5e9}.btn-g{background:#10b981}.btn-p{background:#8b5cf6}.btn-r{background:#ef4444}.btn-gr{background:#e2e8f0;color:#334155}
label{font-size:.78rem;color:#64748b;display:block;margin-top:8px;margin-bottom:3px}
input,textarea,select{width:100%;padding:10px;border-radius:8px;border:1px solid #cbd5e1;background:#f8fafc;color:#1e293b;font-size:.88rem;font-family:inherit}
textarea{min-height:60px}
.note{font-size:.75rem;color:#64748b;margin-top:6px}
.item{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:10px;margin-bottom:6px}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.68rem}
.b-do{background:#dbeafe;color:#1d4ed8}.b-ch{background:#fef3c7;color:#b45309}.b-done{background:#d1fae5;color:#047857}
.row{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.row button{flex:1;padding:6px;font-size:.72rem;border:none;border-radius:6px;cursor:pointer}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#10b981;color:#fff;padding:10px 16px;border-radius:10px;font-size:.85rem;display:none;z-index:200}

/* تقویم شبیه تصویر */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:6px}
.cal-head button{background:#e0f2fe;border:none;color:#0369a1;padding:8px 12px;border-radius:10px;font-size:.8rem;cursor:pointer;white-space:nowrap}
.cal-title{font-size:1.05rem;font-weight:700;color:#0f172a;text-align:center;flex:1}
.cal-year-nav{display:flex;justify-content:center;gap:8px;margin-bottom:10px}
.cal-year-nav button{background:#f1f5f9;border:1px solid #e2e8f0;padding:5px 10px;border-radius:8px;font-size:.75rem;color:#475569;cursor:pointer}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px;text-align:center;font-size:.72rem;color:#94a3b8}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-day{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:8px 2px;text-align:center;cursor:pointer;min-height:52px}
.cal-day:active{background:#f1f5f9}
.cal-day .j{font-size:.95rem;color:#1e293b;font-weight:500}
.cal-day .g{font-size:.62rem;color:#94a3b8;margin-top:2px}
.cal-day.today{background:#dbeafe;border-color:#3b82f6}
.cal-day.has{border-color:#10b981;background:#ecfdf5}
.cal-day.empty{background:transparent;border:1px dashed transparent;cursor:default}

.modal-bg{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:100;align-items:flex-end;justify-content:center;padding:12px}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:16px;padding:16px;width:100%;max-width:420px;max-height:85vh;overflow-y:auto}
.modal h3{font-size:1rem;margin-bottom:8px;color:#0f172a}
</style>
</head>
<body>
<div class="box">
  <div class="header">
    <div class="logo">🤖</div>
    <h1>منشی هوشمند</h1>
    <p class="sub">تقویم شمسی + ثبت کارها</p>
  </div>

  <div class="nav">
    <button class="on" onclick="go('home',this)">خانه</button>
    <button onclick="go('cal',this)">تقویم</button>
    <button onclick="go('forms',this)">ثبت</button>
    <button onclick="go('set',this)">تنظیمات</button>
  </div>

  <!-- خانه -->
  <div id="home" class="panel on">
    <div class="card">
      <h2>📋 جلسات، یادداشت‌ها و یادآوری‌ها</h2>
      <div id="list"></div>
      <p class="note" id="emptyNote">هنوز موردی ثبت نشده. از تقویم یا بخش ثبت اضافه کنید.</p>
    </div>
  </div>

  <!-- تقویم شمسی -->
  <div id="cal" class="panel">
    <div class="card">
      <div class="cal-year-nav">
        <button onclick="changeYear(-1)">« سال قبل</button>
        <button onclick="changeYear(1)">سال بعد »</button>
      </div>
      <div class="cal-head">
        <button onclick="changeMonth(1)">ماه بعد</button>
        <div class="cal-title" id="calTitle">—</div>
        <button onclick="changeMonth(-1)">ماه قبل</button>
      </div>
      <div class="cal-week">
        <div>جمعه</div><div>پنجشنبه</div><div>چهارشنبه</div><div>سه‌شنبه</div><div>دوشنبه</div><div>یکشنبه</div><div>شنبه</div>
      </div>
      <div class="cal-days" id="calDays"></div>
      <p class="note">برای انتخاب روز، روی آن کلیک کنید.</p>
    </div>
  </div>

  <!-- ثبت -->
  <div id="forms" class="panel">
    <div class="card">
      <h2>➕ ثبت مورد جدید</h2>
      <label>نوع</label>
      <select id="fType">
        <option value="meeting">جلسه</option>
        <option value="note">یادداشت</option>
        <option value="reminder">یادآوری</option>
      </select>
      <label>عنوان</label>
      <input id="fTitle" placeholder="عنوان">
      <label>تاریخ (مثلاً ۱۴۰۵/۷/۲۶)</label>
      <input id="fWhen" placeholder="اختیاری">
      <label>توضیح</label>
      <textarea id="fDesc"></textarea>
      <label>وضعیت</label>
      <select id="fStatus">
        <option value="doing">در حال انجام</option>
        <option value="change">تغییر</option>
        <option value="done">تکمیل</option>
      </select>
      <button class="btn btn-g" onclick="addFromForm()">ثبت</button>
    </div>
  </div>

  <!-- تنظیمات -->
  <div id="set" class="panel">
    <div class="card">
      <h2>🔗 لینک واتساپ / ایمیل</h2>
      <label>نام</label>
      <input id="lName" placeholder="مثلاً واتساپ کاری">
      <label>نوع</label>
      <select id="lType"><option value="whatsapp">واتساپ</option><option value="email">ایمیل</option><option value="other">سایر</option></select>
      <label>لینک یا شماره / ایمیل</label>
      <input id="lUrl" placeholder="wa.me یا email">
      <button class="btn btn-g" onclick="addLink()">افزودن</button>
      <div id="linksList" style="margin-top:8px"></div>
    </div>
    <div class="card">
      <h2>💾 پشتیبان</h2>
      <button class="btn btn-g" onclick="backup()">دانلود پشتیبان</button>
      <input type="file" accept=".json" onchange="restore(event)" style="margin-top:6px">
      <button class="btn btn-r" onclick="clearAll()">پاک کردن همه</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h3 id="modalTitle">ثبت برای روز</h3>
    <label>نوع</label>
    <select id="mdType">
      <option value="meeting">جلسه</option>
      <option value="note">یادداشت</option>
      <option value="reminder">یادآوری</option>
    </select>
    <label>عنوان</label>
    <input id="mdTitle" placeholder="عنوان">
    <label>توضیح</label>
    <textarea id="mdDesc"></textarea>
    <label>وضعیت</label>
    <select id="mdStatus">
      <option value="doing">در حال انجام</option>
      <option value="change">تغییر</option>
      <option value="done">تکمیل</option>
    </select>
    <button class="btn btn-g" style="margin-top:10px" onclick="saveModal()">ثبت</button>
    <button class="btn btn-gr" onclick="closeModal()">بستن</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
function div(a,b){return Math.floor(a/b)}
function gregorianToJalali(gy,gm,gd){
  var g_d_m=[0,31,59,90,120,151,181,212,243,273,304,334];
  var gy2=(gm>2)?(gy+1):gy;
  var days=355666+365*gy+div(gy2+3,4)-div(gy2+99,100)+div(gy2+399,400)+gd+g_d_m[gm-1];
  var jy=-1595+33*div(days,12053); days%=12053;
  jy+=4*div(days,1461); days%=1461;
  if(days>365){jy+=div(days-1,365); days=(days-1)%365}
  var jm=(days<186)?1+div(days,31):7+div(days-186,30);
  var jd=1+((days<186)?(days%31):((days-186)%30));
  return [jy,jm,jd];
}
function jalaliToGregorian(jy,jm,jd){
  var jy2=jy+1595;
  var days=-355668+365*jy2+div(jy2,33)*8+div((jy2%33)+3,4)+jd+((jm<7)?(jm-1)*31:(jm-7)*30+186);
  var gy=400*div(days,146097); days%=146097;
  if(days>36524){gy+=100*div(--days,36524); days%=36524; if(days>=365)days++}
  gy+=4*div(days,1461); days%=1461;
  if(days>365){gy+=div(days-1,365); days=(days-1)%365}
  var gd=days+1;
  var sal_a=[0,31,((gy%4===0&&gy%100!==0)||gy%400===0)?29:28,31,30,31,30,31,31,30,31,30,31];
  var gm; for(gm=1;gm<=12&&gd>sal_a[gm];gm++) gd-=sal_a[gm];
  return [gy,gm,gd];
}
var jMonths=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
function daysInJalaliMonth(jy,jm){
  if(jm<=6) return 31;
  if(jm<=11) return 30;
  var g=jalaliToGregorian(jy,12,29);
  var j=gregorianToJalali(g[0],g[1],g[2]+1);
  return (j[1]===12)?30:29;
}

var viewJY, viewJM;
(function(){
  var n=new Date();
  var j=gregorianToJalali(n.getFullYear(),n.getMonth()+1,n.getDate());
  viewJY=j[0]; viewJM=j[1];
})();

function changeMonth(d){
  viewJM+=d;
  if(viewJM>12){viewJM=1;viewJY++}
  if(viewJM<1){viewJM=12;viewJY--}
  renderCal();
}
function changeYear(d){ viewJY+=d; renderCal(); }

function renderCal(){
  document.getElementById('calTitle').textContent = viewJY + ' ' + jMonths[viewJM-1];
  var firstG=jalaliToGregorian(viewJY,viewJM,1);
  var firstDate=new Date(firstG[0],firstG[1]-1,firstG[2]);
  // در RTL هدر: جمعه ... شنبه — ستون راست = شنبه = start
  var startDow=(firstDate.getDay()+1)%7; // 0=شنبه
  var dim=daysInJalaliMonth(viewJY,viewJM);
  var today=new Date();
  var tj=gregorianToJalali(today.getFullYear(),today.getMonth()+1,today.getDate());
  var items=loadItems();
  var html='';
  for(var i=0;i<startDow;i++) html+='<div class="cal-day empty"></div>';
  for(var d=1;d<=dim;d++){
    var g=jalaliToGregorian(viewJY,viewJM,d);
    var isToday=(tj[0]===viewJY&&tj[1]===viewJM&&tj[2]===d);
    var key=viewJY+'-'+viewJM+'-'+d;
    var has=items.some(function(it){return it.jdate===key});
    html+='<div class="cal-day'+(isToday?' today':'')+(has?' has':'')+'" onclick="openDay('+viewJY+','+viewJM+','+d+','+g[0]+','+g[1]+','+g[2]+')">'+
      '<div class="j">'+d+'</div><div class="g">'+g[0]+'/'+g[1]+'/'+g[2]+'</div></div>';
  }
  document.getElementById('calDays').innerHTML=html;
}

var modalJ=null;
function openDay(jy,jm,jd,gy,gm,gd){
  modalJ={jy:jy,jm:jm,jd:jd,key:jy+'-'+jm+'-'+jd};
  document.getElementById('modalTitle').textContent='ثبت برای '+jd+' '+jMonths[jm-1]+' '+jy;
  document.getElementById('mdTitle').value='';
  document.getElementById('mdDesc').value='';
  document.getElementById('modalBg').classList.add('on');
}
function closeModal(){ document.getElementById('modalBg').classList.remove('on'); }
function saveModal(){
  var title=document.getElementById('mdTitle').value.trim();
  if(!title) return toast('عنوان را وارد کنید');
  var arr=loadItems();
  arr.unshift({
    id:Date.now(),
    type:document.getElementById('mdType').value,
    title:title,
    desc:document.getElementById('mdDesc').value.trim(),
    status:document.getElementById('mdStatus').value,
    jdate:modalJ.key,
    when:modalJ.jd+' '+jMonths[modalJ.jm-1]+' '+modalJ.jy,
    created:new Date().toISOString()
  });
  saveItems(arr); closeModal(); renderCal(); renderList(); toast('✓ ثبت شد');
}

function go(id,btn){
  document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('on')});
  document.querySelectorAll('.nav button').forEach(function(b){b.classList.remove('on')});
  document.getElementById(id).classList.add('on');
  if(btn) btn.classList.add('on');
  if(id==='home') renderList();
  if(id==='cal') renderCal();
  if(id==='set') renderLinks();
}
function toast(m){
  var t=document.getElementById('toast'); t.textContent=m; t.style.display='block';
  setTimeout(function(){t.style.display='none'},1800);
}
function loadItems(){ try{return JSON.parse(localStorage.getItem('items')||'[]')}catch(e){return[]} }
function saveItems(a){ localStorage.setItem('items',JSON.stringify(a)); }
function typeLabel(t){ return t==='meeting'?'📅 جلسه':t==='note'?'📝 یادداشت':'⏰ یادآوری'; }
function statusLabel(s){ return s==='doing'?['در حال انجام','b-do']:s==='change'?['تغییر','b-ch']:['تکمیل','b-done']; }
function esc(s){ var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function renderList(){
  var arr=loadItems(), box=document.getElementById('list'), empty=document.getElementById('emptyNote');
  box.innerHTML='';
  if(!arr.length){ empty.style.display='block'; return; }
  empty.style.display='none';
  arr.forEach(function(it){
    var st=statusLabel(it.status);
    var d=document.createElement('div'); d.className='item';
    d.innerHTML='<div>'+typeLabel(it.type)+' '+esc(it.title)+' <span class="badge '+st[1]+'">'+st[0]+'</span></div>'+
      (it.when?'<div class="note">'+esc(it.when)+'</div>':'')+
      (it.desc?'<div class="note">'+esc(it.desc)+'</div>':'')+
      '<div class="row">'+
      '<button style="background:#dbeafe;color:#1d4ed8" onclick="setStatus('+it.id+',\'doing\')">در حال انجام</button>'+
      '<button style="background:#fef3c7;color:#b45309" onclick="setStatus('+it.id+',\'change\')">تغییر</button>'+
      '<button style="background:#d1fae5;color:#047857" onclick="setStatus('+it.id+',\'done\')">تکمیل</button>'+
      '<button style="background:#fee2e2;color:#b91c1c" onclick="delItem('+it.id+')">حذف</button></div>';
    box.appendChild(d);
  });
}
function setStatus(id,s){ var a=loadItems(); a.forEach(function(it){if(it.id===id)it.status=s}); saveItems(a); renderList(); toast('✓ وضعیت عوض شد'); }
function delItem(id){ if(!confirm('حذف شود؟'))return; saveItems(loadItems().filter(function(it){return it.id!==id})); renderList(); renderCal(); toast('✓ حذف شد'); }

function addFromForm(){
  var title=document.getElementById('fTitle').value.trim();
  if(!title) return toast('عنوان را وارد کنید');
  var arr=loadItems();
  arr.unshift({id:Date.now(),type:document.getElementById('fType').value,title:title,desc:document.getElementById('fDesc').value.trim(),when:document.getElementById('fWhen').value.trim(),status:document.getElementById('fStatus').value,created:new Date().toISOString()});
  saveItems(arr);
  document.getElementById('fTitle').value=''; document.getElementById('fDesc').value=''; document.getElementById('fWhen').value='';
  toast('✓ ثبت شد');
}

function loadLinks(){ try{return JSON.parse(localStorage.getItem('links')||'[]')}catch(e){return[]} }
function saveLinks(a){ localStorage.setItem('links',JSON.stringify(a)); }
function addLink(){
  var name=document.getElementById('lName').value.trim(), type=document.getElementById('lType').value, url=document.getElementById('lUrl').value.trim();
  if(!name||!url) return toast('نام و لینک را پر کنید');
  if(type==='whatsapp'&&url.indexOf('http')!==0) url='https://wa.me/'+url.replace(/[^0-9]/g,'');
  if(type==='email'&&url.indexOf('@')>-1&&url.indexOf('mailto:')!==0) url='mailto:'+url;
  var arr=loadLinks(); arr.push({id:Date.now(),name:name,type:type,url:url,active:true});
  saveLinks(arr); document.getElementById('lName').value=''; document.getElementById('lUrl').value=''; renderLinks(); toast('✓ اضافه شد');
}
function renderLinks(){
  var arr=loadLinks(), box=document.getElementById('linksList'); box.innerHTML='';
  if(!arr.length){ box.innerHTML='<p class="note">لینکی نیست</p>'; return; }
  arr.forEach(function(l){
    var d=document.createElement('div'); d.className='item';
    d.innerHTML='<div>'+(l.active?'✅ ':'❌ ')+esc(l.name)+'</div><div class="row">'+
      '<a class="btn btn-b" style="padding:6px;font-size:.75rem;margin:0;flex:1;text-decoration:none" href="'+l.url+'" target="_blank">باز کردن</a>'+
      '<button style="background:#fef3c7;color:#b45309" onclick="toggleLink('+l.id+')">'+(l.active?'غیرفعال':'فعال')+'</button>'+
      '<button style="background:#fee2e2;color:#b91c1c" onclick="delLink('+l.id+')">حذف</button></div>';
    box.appendChild(d);
  });
}
function toggleLink(id){ var a=loadLinks(); a.forEach(function(l){if(l.id===id)l.active=!l.active}); saveLinks(a); renderLinks(); }
function delLink(id){ if(!confirm('حذف؟'))return; saveLinks(loadLinks().filter(function(l){return l.id!==id})); renderLinks(); toast('✓ حذف شد'); }

function backup(){
  var data={items:loadItems(),links:loadLinks(),date:new Date().toISOString()};
  var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
  a.download='backup.json'; a.click(); toast('✓ دانلود شد');
}
function restore(e){
  var f=e.target.files[0]; if(!f)return;
  var r=new FileReader();
  r.onload=function(ev){ try{ var d=JSON.parse(ev.target.result); if(d.items)saveItems(d.items); if(d.links)saveLinks(d.links); renderList(); renderLinks(); renderCal(); toast('✓ بازیابی شد'); }catch(err){ toast('نامعتبر'); } };
  r.readAsText(f);
}
function clearAll(){ if(!confirm('همه پاک شود؟'))return; localStorage.removeItem('items'); localStorage.removeItem('links'); renderList(); renderLinks(); renderCal(); toast('✓ پاک شد'); }

renderList();
  <script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/smart-secretary/sw.js')
    .then(function () { console.log('SW ok'); })
    .catch(function (e) { console.log('SW fail', e); });
}
</script>
</body>
</html>
