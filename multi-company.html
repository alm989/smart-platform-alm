<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1d4ed8"><title>چند شرکتی هوشمند</title>
<style>
/* module-kit.css — پوسته مشترک همه ماژول‌ها */
:root{
  --bg:#070b14;--panel:#0c1222;--card:#151c2e;--line:#2a3548;--txt:#e8eef7;--muted:#8b9bb4;
  --pri:#3b82f6;--pri-dim:rgba(59,130,246,.15);--ok:#22c55e;--bad:#ef4444;
  --glass:rgba(21,28,46,.95);--shadow:0 16px 40px rgba(0,0,0,.45);--radius:14px;
  --mic-on:#22c55e;--mic-off:#ef4444;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Tahoma,"Segoe UI",system-ui,sans-serif;
  background:radial-gradient(900px 480px at 15% -10%,rgba(59,130,246,.12),transparent 50%),var(--bg);
  color:var(--txt);min-height:100dvh;line-height:1.5;
}
.app-shell{
  display:grid;
  grid-template-columns:260px 1fr;
  grid-template-rows:auto 1fr auto;
  min-height:100dvh;
}
@media(max-width:960px){
  .app-shell{grid-template-columns:1fr}
  .side-panel{display:none}
  .side-panel.open{
    display:block;position:fixed;top:0;right:0;bottom:0;width:min(280px,92vw);
    z-index:70;background:var(--panel);border-left:1px solid var(--line);
    box-shadow:var(--shadow);overflow:auto;
  }
}

/* هدر: راست=تاریخ/ساعت/کاربر | وسط=منو+خروج | چپ=لوگو+نام */
.topbar{
  grid-column:1/-1;
  display:flex;flex-direction:row;align-items:center;gap:12px;
  padding:8px 14px;min-height:58px;
  background:rgba(12,18,34,.97);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:50;
}
/* در RTL اولین فرزند سمت راست است */
.header-clock{
  display:flex;flex-direction:column;align-items:flex-start;justify-content:center;
  gap:1px;padding:5px 11px;border-radius:11px;
  background:rgba(255,255,255,.03);border:1px solid var(--line);
  line-height:1.3;flex:0 0 auto;min-width:118px;
}
.header-clock .j{font-size:.78rem;font-weight:800;color:#93c5fd}
.header-clock .g{font-size:.62rem;color:var(--muted);direction:ltr;unicode-bidi:isolate}
.header-clock .c{font-size:.74rem;color:#86efac;font-weight:700}
.header-clock .u{font-size:.65rem;color:#fcd34d;font-weight:700;margin-top:2px;padding-top:2px;border-top:1px solid var(--line);max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.mega{
  display:flex;align-items:center;gap:3px;flex:1 1 auto;justify-content:center;
  background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;
  padding:3px 5px;min-width:0;
}
.mega-item{position:relative}
.mega-item>.mega-btn{
  display:block;background:transparent;border:none;color:var(--muted);
  border-radius:9px;padding:8px 11px;font-size:.74rem;font-weight:700;
  cursor:default;font-family:inherit;white-space:nowrap;
}
.mega-item:hover>.mega-btn,.mega-item:focus-within>.mega-btn{background:var(--pri);color:#fff}
.mega-item .drop{
  position:absolute;top:calc(100% + 5px);right:0;min-width:168px;
  background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:5px;
  z-index:60;box-shadow:var(--shadow);
  opacity:0;visibility:hidden;transform:translateY(4px);transition:.14s;pointer-events:none;
}
.mega-item:hover>.drop,.mega-item:focus-within>.drop{opacity:1;visibility:visible;transform:none;pointer-events:auto}
.mega-item::after{content:"";position:absolute;left:0;right:0;top:100%;height:8px}
.mega-item .drop button{
  display:block;width:100%;text-align:right;background:transparent;border:none;
  color:var(--txt);padding:8px 10px;border-radius:8px;font-size:.76rem;cursor:pointer;font-family:inherit;
}
.mega-item .drop button:hover{background:var(--pri-dim);color:#93c5fd}
.btn-exit{
  background:linear-gradient(135deg,#f87171,#dc2626);color:#fff;border:none;border-radius:9px;
  padding:8px 12px;font-size:.72rem;font-weight:800;cursor:pointer;font-family:inherit;flex-shrink:0;
}
.icon-btn{
  width:34px;height:34px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);cursor:pointer;display:grid;place-items:center;font-size:14px;flex-shrink:0;
}
.icon-btn.mic-on{background:rgba(34,197,94,.18);border-color:var(--mic-on);color:var(--mic-on)}
.icon-btn.mic-off{background:rgba(239,68,68,.12);border-color:var(--mic-off);color:var(--mic-off)}

.brand{display:flex;align-items:center;gap:8px;flex:0 0 auto;margin-right:auto}
.logo{
  width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#60a5fa,#1d4ed8);
  display:grid;place-items:center;overflow:hidden;flex-shrink:0;
}
.logo img{width:100%;height:100%;object-fit:contain}
.brand h1{font-size:.88rem;font-weight:800;white-space:nowrap}

/* پنل درختی راست */
.side-panel{
  grid-row:2;grid-column:1;border-left:1px solid var(--line);
  background:var(--panel);padding:12px 10px;overflow:auto;
}
.side-panel h3{font-size:.7rem;color:#93c5fd;margin-bottom:10px}
.tree details{margin-bottom:6px}
.tree summary{
  cursor:pointer;padding:9px 11px;border-radius:11px;background:var(--card);
  border:1px solid var(--line);font-size:.76rem;font-weight:700;list-style:none;
}
.tree summary::-webkit-details-marker{display:none}
.tree details[open]>summary{border-color:rgba(59,130,246,.45);background:var(--pri-dim);color:#93c5fd}
.tree .leaf{
  display:block;width:100%;text-align:right;background:transparent;border:none;
  color:var(--muted);padding:7px 12px;font-size:.73rem;cursor:pointer;font-family:inherit;border-radius:8px;margin-top:2px;
}
.tree .leaf:hover,.tree .leaf.on{background:rgba(59,130,246,.12);color:var(--txt)}
.main{grid-row:2;grid-column:2;padding:14px;overflow:auto}
@media(max-width:960px){.main{grid-column:1}}
.statusbar{
  grid-column:1/-1;display:flex;justify-content:space-between;padding:7px 14px;
  border-top:1px solid var(--line);background:rgba(12,18,34,.95);font-size:.7rem;color:var(--muted);
}
.panel{display:none}.panel.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.card h2{font-size:.88rem;margin-bottom:10px;font-weight:800}
label{display:block;font-size:.7rem;color:var(--muted);margin:7px 0 3px}
input,select,textarea{
  width:100%;padding:10px;border-radius:11px;border:1px solid var(--line);
  background:#0a101c;color:var(--txt);font-family:inherit;font-size:14px;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(59,130,246,.18)}
input.err,select.err,textarea.err{border-color:var(--bad)}
.field-error{color:#fca5a5;font-size:.65rem;min-height:.9em}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:600px){.row{grid-template-columns:1fr}}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{border:none;border-radius:11px;padding:9px 13px;font-weight:700;font-size:.78rem;cursor:pointer;font-family:inherit}
.btn-p{background:linear-gradient(135deg,#60a5fa,#2563eb);color:#fff}
.btn-g{background:#243044;color:#e2e8f0}
.btn-b{background:var(--bad);color:#fff}
.btn-sm{padding:5px 9px;font-size:.7rem}
table{width:100%;border-collapse:collapse;font-size:.76rem}
th,td{border-bottom:1px solid var(--line);padding:8px 5px;text-align:right}
th{color:#93c5fd;font-size:.7rem}
.badge{display:inline-block;padding:2px 7px;border-radius:999px;font-size:.62rem}
.badge-on{background:#14532d;color:#86efac}.badge-off{background:#3f1d1d;color:#fca5a5}
.empty{color:var(--muted);font-size:.78rem;padding:6px 0}
.kpi{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-bottom:10px}
.kpi .box{background:linear-gradient(160deg,rgba(59,130,246,.12),rgba(21,28,46,.95));border:1px solid rgba(59,130,246,.25);border-radius:12px;padding:12px}
.kpi .n{font-size:1.15rem;font-weight:800;color:#93c5fd}.kpi .l{font-size:.68rem;color:var(--muted)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ok);color:#052e16;padding:10px 16px;border-radius:12px;font-weight:700;opacity:0;transition:.2s;z-index:100;font-size:.8rem}
.toast.show{opacity:1}.toast.err{background:var(--bad);color:#fff}

/* تقویم شمسی */
.date-wrap{position:relative}
.jcal-pop{
  position:absolute;z-index:80;background:var(--glass);border:1px solid var(--line);
  border-radius:14px;padding:12px;width:320px;box-shadow:var(--shadow);
}
.jcal-head{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-bottom:8px}
.jcal-head button{
  width:28px;height:28px;border-radius:8px;border:1px solid var(--line);
  background:#0a101c;color:var(--txt);cursor:pointer;font-size:.75rem;
}
.jcal-head .title{font-size:.8rem;font-weight:800;color:#93c5fd}
.jcal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px}
.jcal-week span{text-align:center;font-size:.58rem;color:var(--muted);padding:4px 1px;line-height:1.2}
.jcal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.jcal-days button{
  border:none;background:transparent;color:var(--txt);border-radius:9px;
  padding:5px 2px;cursor:pointer;font-family:inherit;min-height:48px;
}
.jcal-days button .jd{display:block;font-size:.78rem;font-weight:700}
.jcal-days button .gd{display:block;font-size:.5rem;color:var(--muted);line-height:1.15;margin-top:1px}
.jcal-days button:hover{background:#243044}
.jcal-days button.on{background:var(--pri);color:#fff}
.jcal-days button.on .gd{color:#dbeafe}
.jcal-days button.out{opacity:.3}

</style></head><body>

/* module-kit.js — پوسته مشترک همه ماژول‌ها */
(function(global){
"use strict";

var FA=["۰","۱","۲","۳","۴","۵","۶","۷","۸","۹"];
function toFa(n){return String(n).replace(/\d/g,function(d){return FA[+d];});}
function toEn(s){
  return String(s)
    .replace(/[۰-۹]/g,function(d){return "۰۱۲۳۴۵۶۷۸۹".indexOf(d);})
    .replace(/[٠-٩]/g,function(d){return "٠١٢٣٤٥٦٧٨٩".indexOf(d);});
}

function g2j(gy,gm,gd){
  var g_d_m=[0,31,59,90,120,151,181,212,243,273,304,334];
  var gy2=(gm>2)?(gy+1):gy;
  var days=355666+365*gy+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)+gd+g_d_m[gm-1];
  var jy=-1595+33*Math.floor(days/12053);days%=12053;
  jy+=4*Math.floor(days/1461);days%=1461;
  if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365;}
  var jm=(days<186)?1+Math.floor(days/31):7+Math.floor((days-186)/30);
  var jd=1+((days<186)?(days%31):((days-186)%30));
  return {jy:jy,jm:jm,jd:jd};
}
function j2g(jy,jm,jd){
  var jy2=jy-979,jm2=jm-1,jd2=jd-1;
  var days=365*jy2+Math.floor(jy2/33)*8+Math.floor(((jy2%33)+3)/4);
  for(var i=0;i<jm2;++i) days+=(i<6?31:30);
  days+=jd2;
  var gy=1600+400*Math.floor(days/146097);days%=146097;
  var leap=true;
  if(days>=36525){days--;gy+=100*Math.floor(days/36524);days%=36524;if(days>=365)leap=false;else days++;}
  gy+=4*Math.floor(days/1461);days%=1461;
  if(days>=366){leap=false;days--;gy+=Math.floor(days/365);days=days%365;}
  var gd=days+1, sal_a=[0,31,(leap?29:28),31,30,31,30,31,31,30,31,30,31],gm;
  for(gm=1;gm<=12&&gd>sal_a[gm];gm++) gd-=sal_a[gm];
  return {gy:gy,gm:gm,gd:gd};
}
function jMonthLength(jy,jm){
  if(jm<=6)return 31;
  if(jm<=11)return 30;
  var a=j2g(jy,12,30); var b=g2j(a.gy,a.gm,a.gd);
  return (b.jy===jy&&b.jm===12&&b.jd===30)?30:29;
}

var JM=["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];
/* روزهای هفته کامل */
var JW_FULL=["شنبه","یکشنبه","دوشنبه","سه‌شنبه","چهارشنبه","پنجشنبه","جمعه"];
var JW_SHORT=["ش","ی","د","س","چ","پ","ج"];

function startClock(elJ, elG, elC){
  function tick(){
    var n=new Date();
    var j=g2j(n.getFullYear(),n.getMonth()+1,n.getDate());
    if(elJ) elJ.textContent=toFa(j.jy)+"/"+toFa(String(j.jm).padStart(2,"0"))+"/"+toFa(String(j.jd).padStart(2,"0"));
    if(elG) elG.textContent=n.getFullYear()+"/"+String(n.getMonth()+1).padStart(2,"0")+"/"+String(n.getDate()).padStart(2,"0");
    if(elC) elC.textContent=toFa(String(n.getHours()).padStart(2,"0"))+":"+toFa(String(n.getMinutes()).padStart(2,"0"))+":"+toFa(String(n.getSeconds()).padStart(2,"0"));
  }
  tick(); setInterval(tick,1000);
}

function getActiveUser(){
  try{
    var a=JSON.parse(localStorage.getItem("smart_auth_v1")||"null");
    if(a&&a.session&&a.session.user) return a.session.user;
    if(a&&a.creds&&a.creds.admin&&a.creds.admin.user) return a.creds.admin.user;
  }catch(e){}
  try{
    var s=JSON.parse(sessionStorage.getItem("smart_user_session")||"null");
    if(s&&s.user) return s.user;
  }catch(e){}
  return "کاربر محلی";
}

var Validators={
  required:function(v){return String(v||"").trim()?null:"این فیلد الزامی است";},
  number:function(v){if(v===""||v==null)return null; if(!/^-?\d+(\.\d+)?$/.test(toEn(String(v)).trim())) return "فقط عدد وارد کنید"; return null;},
  integer:function(v){if(v===""||v==null)return null; if(!/^-?\d+$/.test(toEn(String(v)).trim())) return "فقط عدد صحیح"; return null;},
  date:function(v){if(v===""||v==null)return null; if(!/^\d{4}[\/\-]\d{1,2}[\/\-]\d{1,2}$/.test(toEn(String(v)).trim())) return "تاریخ نامعتبر (مثال: ۱۴۰۴/۰۷/۰۱)"; return null;},
  time:function(v){if(v===""||v==null)return null; if(!/^\d{1,2}:\d{2}(:\d{2})?$/.test(toEn(String(v)).trim())) return "ساعت نامعتبر (مثال: ۱۴:۳۰)"; return null;},
  code:function(v){if(v===""||v==null)return null; if(!/^[A-Za-z0-9._-]{1,20}$/.test(String(v).trim())) return "کد فقط حروف/عدد و ._-"; return null;},
  phone:function(v){if(v===""||v==null)return null; var t=toEn(String(v)).replace(/\s/g,""); if(!/^0?\d{10,11}$/.test(t)&&!/^\+?\d{10,15}$/.test(t)) return "شماره تماس نامعتبر"; return null;}
};

function bindFieldValidation(root){
  (root||document).querySelectorAll("[data-validate]").forEach(function(el){
    var types=(el.getAttribute("data-validate")||"").split(/\s+/);
    function run(){
      var msg=null;
      for(var i=0;i<types.length;i++){
        var fn=Validators[types[i]];
        if(fn){ msg=fn(el.value); if(msg) break; }
      }
      el.classList.toggle("err", !!msg);
      var err=el.parentNode.querySelector(".field-error");
      if(!err){ err=document.createElement("div"); err.className="field-error"; el.parentNode.appendChild(err); }
      err.textContent=msg||"";
      return !msg;
    }
    el.addEventListener("blur", run);
    el.addEventListener("input", function(){ if(el.classList.contains("err")) run(); });
    el._validate=run;
  });
}
function validateForm(root){
  var ok=true;
  (root||document).querySelectorAll("[data-validate]").forEach(function(el){
    if(el._validate && !el._validate()) ok=false;
  });
  return ok;
}
function enableSpellcheck(root){
  (root||document).querySelectorAll("input[type=text], textarea").forEach(function(el){
    el.setAttribute("spellcheck","true");
    el.setAttribute("lang","fa");
  });
}

var recog=null, micActive=false, micBtn=null;
function initVoice(btn){
  micBtn=btn;
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ if(btn){ btn.title="پشتیبانی نمی‌شود"; btn.classList.add("mic-off"); } return; }
  recog=new SR();
  recog.lang="fa-IR";
  recog.continuous=true;
  recog.interimResults=false;
  recog.onresult=function(ev){
    var t="";
    for(var i=ev.resultIndex;i<ev.results.length;i++) if(ev.results[i].isFinal) t+=ev.results[i][0].transcript;
    if(t){
      var a=document.activeElement;
      if(a && (a.tagName==="INPUT"||a.tagName==="TEXTAREA") && a.type!=="password"){
        var s=a.selectionStart||a.value.length;
        a.value=a.value.slice(0,s)+t+a.value.slice(a.selectionEnd||s);
        a.dispatchEvent(new Event("input",{bubbles:true}));
      }
    }
  };
  recog.onerror=function(){ stopMic(); };
  recog.onend=function(){ if(micActive){ try{recog.start();}catch(e){} } };
  if(btn){
    btn.classList.add("mic-off");
    btn.onclick=function(){ if(micActive) stopMic(); else startMic(); };
  }
}
function startMic(){
  if(!recog) return;
  try{ recog.start(); micActive=true; if(micBtn){ micBtn.classList.remove("mic-off"); micBtn.classList.add("mic-on"); micBtn.title="میکروفون فعال"; } }catch(e){}
}
function stopMic(){
  micActive=false;
  try{ if(recog) recog.stop(); }catch(e){}
  if(micBtn){ micBtn.classList.remove("mic-on"); micBtn.classList.add("mic-off"); micBtn.title="میکروفون خاموش"; }
}

function attachJalaliPicker(input){
  if(!input || input._jcal) return;
  input._jcal=true;
  var dv=input.getAttribute("data-validate")||"";
  if(dv.indexOf("date")<0) input.setAttribute("data-validate", (dv+" date").trim());
  input.setAttribute("autocomplete","off");
  input.setAttribute("inputmode","numeric");
  var wrap=input.closest(".date-wrap")||input.parentNode;
  if(!wrap.classList.contains("date-wrap")){
    var w=document.createElement("div"); w.className="date-wrap";
    input.parentNode.insertBefore(w, input); w.appendChild(input); wrap=w;
  }
  var pop=null, viewY, viewM;
  function close(){ if(pop){ pop.remove(); pop=null; } document.removeEventListener("click", outside); }
  function outside(e){ if(pop && !pop.contains(e.target) && e.target!==input) close(); }
  function open(){
    close();
    var now=new Date();
    var j=g2j(now.getFullYear(), now.getMonth()+1, now.getDate());
    var cur=toEn(input.value||"");
    var m=cur.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
    viewY=m?+m[1]:j.jy; viewM=m?+m[2]:j.jm;
    pop=document.createElement("div"); pop.className="jcal-pop"; wrap.appendChild(pop);
    render();
    setTimeout(function(){ document.addEventListener("click", outside); }, 0);
  }
  function render(){
    if(!pop) return;
    var head=document.createElement("div"); head.className="jcal-head";
    head.innerHTML=
      '<button type="button" data-a="py" title="سال قبل">«</button>'+
      '<button type="button" data-a="pm" title="ماه قبل">‹</button>'+
      '<span class="title">'+JM[viewM-1]+' '+toFa(viewY)+'</span>'+
      '<button type="button" data-a="nm" title="ماه بعد">›</button>'+
      '<button type="button" data-a="ny" title="سال بعد">»</button>';
    var week=document.createElement("div"); week.className="jcal-week";
    JW_FULL.forEach(function(w){ var s=document.createElement("span"); s.textContent=w; week.appendChild(s); });
    var days=document.createElement("div"); days.className="jcal-days";
    var dim=jMonthLength(viewY, viewM);
    var firstG=j2g(viewY, viewM, 1);
    var first=new Date(firstG.gy, firstG.gm-1, firstG.gd);
    var start=(first.getDay()+1)%7;
    for(var i=0;i<start;i++){ var b0=document.createElement("button"); b0.type="button"; b0.className="out"; b0.disabled=true; days.appendChild(b0); }
    for(var d=1;d<=dim;d++){
      (function(day){
        var g=j2g(viewY, viewM, day);
        var gFull=g.gy+"/"+String(g.gm).padStart(2,"0")+"/"+String(g.gd).padStart(2,"0");
        var btn=document.createElement("button"); btn.type="button";
        btn.innerHTML='<span class="jd">'+toFa(day)+'</span><span class="gd">'+gFull+'</span>';
        btn.onclick=function(ev){
          ev.stopPropagation();
          input.value=toFa(viewY)+"/"+toFa(String(viewM).padStart(2,"0"))+"/"+toFa(String(day).padStart(2,"0"));
          input.dispatchEvent(new Event("input",{bubbles:true}));
          input.dispatchEvent(new Event("change",{bubbles:true}));
          if(input._validate) input._validate();
          close();
        };
        days.appendChild(btn);
      })(d);
    }
    pop.innerHTML=""; pop.appendChild(head); pop.appendChild(week); pop.appendChild(days);
    head.querySelectorAll("button").forEach(function(b){
      b.onclick=function(ev){
        ev.stopPropagation();
        var a=b.getAttribute("data-a");
        if(a==="pm"){ viewM--; if(viewM<1){ viewM=12; viewY--; } }
        if(a==="nm"){ viewM++; if(viewM>12){ viewM=1; viewY++; } }
        if(a==="py") viewY--;
        if(a==="ny") viewY++;
        render();
      };
    });
  }
  input.addEventListener("focus", open);
  input.addEventListener("click", open);
}
function attachAllDatePickers(root){
  (root||document).querySelectorAll("input[data-jdate], input.jdate").forEach(attachJalaliPicker);
}

function showPanel(id){
  document.querySelectorAll(".panel").forEach(function(p){ p.classList.remove("on"); });
  var el=document.getElementById(id);
  if(el) el.classList.add("on");
  document.querySelectorAll(".tree .leaf").forEach(function(b){
    b.classList.toggle("on", b.getAttribute("data-panel")===id);
  });
}

function saveAndExit(saveFn, suiteUrl){
  try{ if(typeof saveFn==="function") saveFn(); }catch(e){}
  try{ localStorage.setItem("smart_last_exit", new Date().toISOString()); }catch(e){}
  location.href=suiteUrl||"suite.html";
}

/** راه‌اندازی کامل پوسته مشترک */
function bootShell(opts){
  opts=opts||{};
  var elJ=document.getElementById(opts.elJ||"dtJ");
  var elG=document.getElementById(opts.elG||"dtG");
  var elC=document.getElementById(opts.elC||"dtC");
  var elU=document.getElementById(opts.elU||"activeUser");
  var elMic=document.getElementById(opts.elMic||"btnMic");
  var elExit=document.getElementById(opts.elExit||"btnExit");
  startClock(elJ, elG, elC);
  if(elU) elU.textContent=getActiveUser();
  enableSpellcheck(document);
  bindFieldValidation(document);
  attachAllDatePickers(document);
  if(elMic) initVoice(elMic);
  document.querySelectorAll("[data-panel]").forEach(function(b){
    b.addEventListener("click", function(e){
      e.preventDefault();
      showPanel(b.getAttribute("data-panel"));
    });
  });
  var sideBtn=document.getElementById("btnToggleSide");
  if(sideBtn) sideBtn.onclick=function(){ var s=document.getElementById("sidePanel"); if(s) s.classList.toggle("open"); };
  if(elExit){
    elExit.onclick=function(){
      saveAndExit(opts.onSave, opts.suiteUrl||"suite.html");
    };
  }
  window.addEventListener("beforeunload", function(){
    try{ if(typeof opts.onSave==="function") opts.onSave(); }catch(e){}
  });
}

global.ModuleKit={
  toFa:toFa, toEn:toEn, g2j:g2j, j2g:j2g,
  startClock:startClock, getActiveUser:getActiveUser,
  bindFieldValidation:bindFieldValidation, validateForm:validateForm,
  enableSpellcheck:enableSpellcheck,
  initVoice:initVoice, startMic:startMic, stopMic:stopMic,
  attachJalaliPicker:attachJalaliPicker, attachAllDatePickers:attachAllDatePickers,
  showPanel:showPanel, saveAndExit:saveAndExit, bootShell:bootShell,
  Validators:Validators, JW_FULL:JW_FULL
};
})(window);

</script><script>
document.addEventListener("DOMContentLoaded",function(){
var KEY="smart_multicompany_v1",CTX="smart_active_company_v1",K=ModuleKit,tt=null,repMode="cos";
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML;}
function toast(m,e){var t=document.getElementById("toast");t.textContent=m;t.classList.toggle("err",!!e);t.classList.add("show");clearTimeout(tt);tt=setTimeout(function(){t.classList.remove("show");},2200);}
function money(n){return (Number(n)||0).toLocaleString("fa-IR");}
function load(){try{var d=JSON.parse(localStorage.getItem(KEY)||"null");if(!d)return {companies:[],branches:[],years:[],inter:[],log:[]};d.companies=d.companies||[];d.branches=d.branches||[];d.years=d.years||[];d.inter=d.inter||[];d.log=d.log||[];return d;}catch(e){return {companies:[],branches:[],years:[],inter:[],log:[]};}}
function save(d){d.updated=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(d));}
function persist(){save(load());}
K.bootShell({onSave:persist,suiteUrl:"suite.html"});
function cmap(d){var m={};d.companies.forEach(function(c){m[c.id]=c;});return m;}
function fillSel(){var d=load(),o=d.companies.map(function(c){return "<option value=\""+esc(c.id)+"\">"+esc(c.code+" — "+c.name)+"</option>";}).join("");["brCompany","yrCompany","icFrom","icTo","activeCompany"].forEach(function(id){var el=document.getElementById(id);if(!el)return;if(id==="activeCompany"){el.innerHTML="<option value=\"\">—</option>"+o;try{var c=JSON.parse(localStorage.getItem(CTX)||"null");if(c&&c.id)el.value=c.id;}catch(e){}}else el.innerHTML=o||"<option value=\"\">—</option>";});}

function renderCos(){var d=load(),q=(document.getElementById("coSearch").value||"").toLowerCase(),box=document.getElementById("coList"),list=d.companies.filter(function(c){return !q||(c.name+" "+c.code).toLowerCase().indexOf(q)>=0;});box.innerHTML=list.length?("<table><thead><tr><th>کد</th><th>نام</th><th></th></tr></thead><tbody>"+list.map(function(c){return "<tr><td>"+esc(c.code)+"</td><td>"+esc(c.name)+"</td><td><button type=\"button\" class=\"btn btn-b btn-sm\" data-d=\""+esc(c.id)+"\">حذف</button></td></tr>";}).join("")+"</tbody></table>"):"<p class=\"empty\">—</p>";box.querySelectorAll("[data-d]").forEach(function(b){b.onclick=function(){var d=load(),id=b.getAttribute("data-d");d.companies=d.companies.filter(function(c){return c.id!==id;});save(d);fillSel();renderCos();renderDash();};});}
document.getElementById("coSearch").oninput=renderCos;

function renderBr(){var d=load(),m=cmap(d),box=document.getElementById("brList");box.innerHTML=d.branches.length?("<table><thead><tr><th>کد</th><th>نام</th><th>شرکت</th></tr></thead><tbody>"+d.branches.map(function(b){return "<tr><td>"+esc(b.code)+"</td><td>"+esc(b.name)+"</td><td>"+esc(m[b.companyId]?m[b.companyId].name:"")+"</td></tr>";}).join("")+"</tbody></table>"):"<p class=\"empty\">—</p>";}
document.getElementById("btnYrSave").onclick=function(){if(!K.validateForm(document.getElementById("p-years"))){toast("خطا",true);return;}var d=load();d.years.push({id:uid(),companyId:document.getElementById("yrCompany").value,title:document.getElementById("yrTitle").value.trim(),start:document.getElementById("yrStart").value.trim(),end:document.getElementById("yrEnd").value.trim()});save(d);renderYr();toast("ذخیره");};
function renderYr(){var d=load(),m=cmap(d),box=document.getElementById("yrList");box.innerHTML=d.years.length?("<table><thead><tr><th>سال</th><th>شرکت</th><th>بازه</th></tr></thead><tbody>"+d.years.map(function(y){return "<tr><td>"+esc(y.title)+"</td><td>"+esc(m[y.companyId]?m[y.companyId].name:"")+"</td><td>"+esc(y.start+" تا "+y.end)+"</td></tr>";}).join("")+"</tbody></table>"):"<p class=\"empty\">—</p>";}
document.getElementById("btnIcSave").onclick=function(){if(!K.validateForm(document.getElementById("p-inter"))){toast("خطا",true);return;}var d=load();d.inter.unshift({id:uid(),fromId:document.getElementById("icFrom").value,toId:document.getElementById("icTo").value,type:document.getElementById("icType").value,amount:Number(K.toEn(document.getElementById("icAmount").value)||0),date:document.getElementById("icDate").value.trim(),ref:document.getElementById("icRef").value.trim()});save(d);renderIc();renderDash();toast("ثبت");};
function renderIc(){var d=load(),m=cmap(d),box=document.getElementById("icList");box.innerHTML=d.inter.length?("<table><thead><tr><th>از</th><th>به</th><th>مبلغ</th></tr></thead><tbody>"+d.inter.map(function(x){return "<tr><td>"+esc(m[x.fromId]?m[x.fromId].name:"")+"</td><td>"+esc(m[x.toId]?m[x.toId].name:"")+"</td><td>"+money(x.amount)+"</td></tr>";}).join("")+"</tbody></table>"):"<p class=\"empty\">—</p>";}
function renderDash(){var d=load(),sum=0;d.inter.forEach(function(x){sum+=Number(x.amount)||0;});document.getElementById("kpiBox").innerHTML="<div class=\"box\"><div class=\"n\">"+d.companies.length+"</div><div class=\"l\">شرکت</div></div><div class=\"box\"><div class=\"n\">"+d.branches.length+"</div><div class=\"l\">شعبه</div></div><div class=\"box\"><div class=\"n\">"+d.inter.length+"</div><div class=\"l\">بین‌شرکتی</div></div><div class=\"box\"><div class=\"n\">"+money(sum)+"</div><div class=\"l\">جمع</div></div>";document.getElementById("recentBox").innerHTML=(d.log&&d.log.length)?("<table><tbody>"+d.log.slice(0,8).map(function(x){return "<tr><td>"+esc(x.at)+"</td><td>"+esc(x.msg)+"</td></tr>";}).join("")+"</tbody></table>"):"<p class=\"empty\">—</p>";}
function renderRep(){var d=load(),m=cmap(d),out=document.getElementById("repOut");if(repMode==="cos")out.innerHTML="<table><thead><tr><th>کد</th><th>نام</th></tr></thead><tbody>"+d.companies.map(function(c){return "<tr><td>"+esc(c.code)+"</td><td>"+esc(c.name)+"</td></tr>";}).join("")+"</tbody></table>";else if(repMode==="brs")out.innerHTML="<table><thead><tr><th>شعبه</th><th>شرکت</th></tr></thead><tbody>"+d.branches.map(function(b){return "<tr><td>"+esc(b.name)+"</td><td>"+esc(m[b.companyId]?m[b.companyId].name:"")+"</td></tr>";}).join("")+"</tbody></table>";else out.innerHTML="<table><thead><tr><th>از</th><th>به</th><th>مبلغ</th></tr></thead><tbody>"+d.inter.map(function(x){return "<tr><td>"+esc(m[x.fromId]?m[x.fromId].name:"")+"</td><td>"+esc(m[x.toId]?m[x.toId].name:"")+"</td><td>"+money(x.amount)+"</td></tr>";}).join("")+"</tbody></table>";}
document.querySelectorAll("[data-r]").forEach(function(b){b.onclick=function(){repMode=b.getAttribute("data-r");renderRep();};});
document.getElementById("btnPrint").onclick=function(){window.print();};

renderAll();
});
