<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>چند شرکتی هوشمند</title><style>/* multi-company — fixes hover, mic, validation */
:root{--bg:#070b14;--panel:#0c1222;--card:#151c2e;--line:#2a3548;--txt:#e8eef7;--muted:#8b9bb4;--pri:#3b82f6;--pri-dim:rgba(59,130,246,.15);--ok:#22c55e;--bad:#ef4444;--glass:rgba(21,28,46,.96);--shadow:0 16px 40px rgba(0,0,0,.45);--radius:14px;--mic-on:#22c55e;--mic-off:#ef4444}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tahoma,"Segoe UI",system-ui,sans-serif;background:radial-gradient(900px 480px at 15% -10%,rgba(59,130,246,.12),transparent 50%),var(--bg);color:var(--txt);min-height:100dvh;line-height:1.5}
.app-shell{display:grid;grid-template-columns:250px 1fr;grid-template-rows:auto 1fr auto;min-height:100dvh}
@media(max-width:960px){.app-shell{grid-template-columns:1fr}.side-panel{display:none}.side-panel.open{display:block;position:fixed;top:0;right:0;bottom:0;width:min(280px,92vw);z-index:70;background:var(--panel);border-left:1px solid var(--line);overflow:auto}}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:8px 12px;min-height:56px;background:rgba(12,18,34,.97);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.brand{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#60a5fa,#1d4ed8);display:grid;place-items:center;flex-shrink:0}
.brand h1{font-size:.84rem;font-weight:800;white-space:nowrap}
.mega{display:flex;align-items:center;gap:2px;flex:1 1 auto;justify-content:center;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:3px;min-width:0}
.mega-item{position:relative}
.mega-item>.mega-btn{display:block;background:transparent;border:none;color:var(--muted);border-radius:8px;padding:7px 10px;font-size:.72rem;font-weight:700;cursor:default;font-family:inherit;white-space:nowrap}
.mega-item.open>.mega-btn,.mega-item:hover>.mega-btn{background:var(--pri);color:#fff}

.mega-item .drop{position:absolute;top:calc(100% + 2px);right:0;min-width:150px;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:4px;z-index:60;box-shadow:var(--shadow);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .08s ease,visibility .08s ease}
.mega-item.open .drop,.mega-item:hover .drop{opacity:1;visibility:visible;pointer-events:auto}
.mega-item .drop button{display:block;width:100%;text-align:right;background:transparent;border:none;color:var(--txt);padding:7px 10px;border-radius:8px;font-size:.74rem;cursor:pointer;font-family:inherit}

.btn-exit{background:linear-gradient(135deg,#f87171,#dc2626);color:#fff;border:none;border-radius:8px;padding:7px 11px;font-size:.7rem;font-weight:800;cursor:pointer;font-family:inherit}

.panel{display:none}.panel.on{display:block}

.field-error{color:#fca5a5;font-size:.62rem;min-height:.85em}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn{border:none;border-radius:10px;padding:8px 12px;font-weight:700;font-size:.76rem;cursor:pointer;font-family:inherit}
.btn-p{background:linear-gradient(135deg,#60a5fa,#2563eb);color:#fff}
.btn-g{background:#243044;color:#e2e8f0}
.btn-b{background:var(--bad);color:#fff}
.btn-sm{padding:4px 8px;font-size:.68rem}
table{width:100%;border-collapse:collapse;font-size:.74rem}
th,td{border-bottom:1px solid var(--line);padding:7px 4px;text-align:right}
th{color:#93c5fd;font-size:.68rem}
.empty{color:var(--muted);font-size:.76rem;padding:6px 0}
.kpi{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-bottom:10px}
.kpi .box{background:linear-gradient(160deg,rgba(59,130,246,.12),rgba(21,28,46,.95));border:1px solid rgba(59,130,246,.25);border-radius:12px;padding:10px}
.kpi .n{font-size:1.1rem;font-weight:800;color:#93c5fd}.kpi .l{font-size:.66rem;color:var(--muted)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ok);color:#052e16;padding:9px 14px;border-radius:12px;font-weight:700;opacity:0;transition:.2s;z-index:100;font-size:.78rem}
.toast.show{opacity:1}.toast.err{background:var(--bad);color:#fff}
.date-wrap{position:relative}
.jcal-pop{position:absolute;z-index:80;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:10px;width:310px;box-shadow:var(--shadow)}

.jcal-head button{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:#0a101c;color:var(--txt);cursor:pointer}
.jcal-head .title{font-size:.76rem;font-weight:800;color:#93c5fd}
.jcal-week,.jcal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.jcal-week span{text-align:center;font-size:.55rem;color:var(--muted);padding:3px 0}
.jcal-days button{border:none;background:transparent;color:var(--txt);border-radius:8px;padding:4px 1px;cursor:pointer;font-family:inherit;min-height:44px}
.jcal-days button .jd{display:block;font-size:.74rem;font-weight:700}
.jcal-days button .gd{display:block;font-size:.48rem;color:var(--muted)}
.jcal-days button:hover{background:#243044}
.jcal-days button.out{opacity:.3}
</style></head><body><div class="app-shell"><header class="topbar"><div class="brand"><div class="logo">🏛️</div><div><h1>چند شرکتی هوشمند</h1></div></div><nav class="mega"><div class="mega-item"><div class="mega-btn">داشبورد</div><div class="drop"><button type="button" data-panel="p-dash">نمای کلی</button></div></div><div class="mega-item"><div class="mega-btn">ثبت</div><div class="drop"><button type="button" data-panel="p-companies">ثبت شرکت</button><button type="button" data-panel="p-branches">ثبت شعبه</button><button type="button" data-panel="p-years">سال مالی</button><button type="button" data-panel="p-inter">بین‌شرکتی</button></div></div><div class="mega-item"><div class="mega-btn">فهرست</div><div class="drop"><button type="button" data-panel="p-companies">شرکت‌ها</button><button type="button" data-panel="p-branches">شعب</button><button type="button" data-panel="p-years">سال‌ها</button></div></div><div class="mega-item"><div class="mega-btn">گزارش‌ها</div><div class="drop"><button type="button" data-panel="p-reports">گزارش‌ها</button></div></div><div class="mega-item"><div class="mega-btn">امکانات</div><div class="drop"><button type="button" id="btnBackup">پشتیبان</button><button type="button" id="btnRestoreTrigger">بازیابی</button></div></div><div class="mega-item"><div class="mega-btn">تنظیمات</div><div class="drop"><button type="button" data-panel="p-dash">شرکت فعال</button><button type="button" id="btnToggleSide">منوی درختی</button></div></div><button type="button" class="btn-exit" id="btnExit">خروج</button></nav><div class="header-left"><button type="button" class="icon-btn mic-off" id="btnMic" title="میکروفون">🎤</button><div class="header-clock"><div class="j" id="dtJ">—</div><div class="g" id="dtG">—</div><div class="c" id="dtC">—</div><div class="u" id="activeUser">—</div></div></div></header><aside class="side-panel" id="sidePanel"><h3>ناوبری</h3><div class="tree"><details open><summary>داشبورد</summary><button type="button" class="leaf on" data-panel= /* میکروفون سریع‌تر: single-shot + interim + بدون حلقه restart سنگین */
var recog=null,micActive=false,micBtn=null;
function insertText(t){
  if(!t)return;
  var a=document.activeElement;
  if(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA")&&a.type!=="password"){
    var s=a.selectionStart!=null?a.selectionStart:a.value.length;
    var e=a.selectionEnd!=null?a.selectionEnd:s;
    a.value=a.value.slice(0,s)+t+a.value.slice(e);
    var pos=s+t.length;
    try{a.setSelectionRange(pos,pos);}catch(err){}
    a.dispatchEvent(new Event("input",{bubbles:true}));
  }
}
function initVoice(btn){
  micBtn=btn;
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){if(btn){btn.classList.add("mic-off");btn.title="پشتیبانی نمی‌شود";}return;}
  recog=new SR();
  recog.lang="fa-IR";
  recog.continuous=false;       /* سریع‌تر از continuous */
  recog.interimResults=true;    /* نتیجه میانی فوری */
  recog.maxAlternatives=1;
  recog.onresult=function(ev){
    var interim="", final="";
    for(var i=ev.resultIndex;i<ev.results.length;i++){
      var txt=ev.results[i][0].transcript;
      if(ev.results[i].isFinal) final+=txt; else interim+=txt;
    }
    if(final) insertText(final);
    /* interim را فقط اگر فیلد خالی از selection است می‌توان نشان داد — برای سرعت فقط final */
  };
  recog.onerror=function(e){if(e.error!=="aborted") stopMic();};
  recog.onend=function(){
    /* اگر کاربر هنوز فعال است، بلافاصله دوباره شروع — بدون تاخیر setTimeout */
    if(micActive){
      try{recog.start();}catch(e){/* busy — یک فریم بعد */ requestAnimationFrame(function(){if(micActive){try{recog.start();}catch(e2){}}});}
    }
  };
  if(btn){
    btn.classList.add("mic-off");
    btn.onclick=function(){if(micActive)stopMic();else startMic();};
  }
}
function startMic(){
  if(!recog)return;
  try{
    recog.start();
    micActive=true;
    if(micBtn){micBtn.classList.remove("mic-off");micBtn.classList.add("mic-on");micBtn.title="فعال — روی فیلد کلیک کنید و صحبت کنید";}
  }catch(e){}
}
function stopMic(){
  micActive=false;
  try{if(recog)recog.abort();}catch(e){}
  if(micBtn){micBtn.classList.remove("mic-on");micBtn.classList.add("mic-off");micBtn.title="میکروفون";}
}
