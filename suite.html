<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>سامانه هوشمند یکپارچه</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tahoma,system-ui,sans-serif;background:radial-gradient(1000px 500px at 80% -20%,#1e3a5f 0%,transparent 50%),#0f172a;color:#e2e8f0;min-height:100dvh;padding:24px 16px}
.wrap{max-width:1100px;margin:0 auto}
h1{text-align:center;font-size:1.4rem;margin-bottom:6px}
.sub{text-align:center;color:#94a3b8;font-size:.85rem;margin-bottom:20px}
.status{text-align:center;font-size:.8rem;color:#94a3b8;margin-bottom:20px;padding:10px;border:1px solid #334155;border-radius:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{background:rgba(30,41,59,.95);border:1px solid #334155;border-radius:18px;padding:20px;text-decoration:none;color:inherit;display:flex;flex-direction:column;min-height:150px;transition:.15s}
.card:hover{transform:translateY(-4px);border-color:#38bdf8}
.icon{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;margin-bottom:12px}
.card h2{font-size:1rem;margin-bottom:8px}
.card p{font-size:.8rem;color:#94a3b8;flex:1}
.tag{display:inline-block;margin-top:10px;font-size:.68rem;padding:4px 10px;border-radius:999px}
.ok{background:#064e3b;color:#6ee7b7}.miss{background:#7f1d1d;color:#fecaca}
.foot{text-align:center;margin-top:28px;font-size:.72rem;color:#64748b}
</style>
</head>
<body>
<div class="wrap">
  <h1>سامانه هوشمند یکپارچه</h1>
  <p class="sub">همه ماژول‌ها · بدون محدودیت نمایش</p>
  <div class="status" id="status">در حال بررسی…</div>
  <div class="grid" id="grid"></div>
  <p class="foot">فایل hr-payroll.html باید کنار suite باشد تا تیک قرمز برطرف شود</p>
</div>
<script>
(function(){
"use strict";
var MODULES=[
  {href:"index.html",icon:"🤖",bg:"linear-gradient(135deg,#0ea5e9,#0284c7)",title:"منشی هوشمند",desc:"جلسه، یادداشت، یادآوری",tag:"اداری",keys:["items"]},
  {href:"assistant.html",icon:"🧠",bg:"linear-gradient(135deg,#8b5cf6,#6d28d9)",title:"دستیار هوشمند",desc:"دانش و پرامپت",tag:"هوش",keys:[]},
  {href:"accounting.html",icon:"📒",bg:"linear-gradient(135deg,#10b981,#047857)",title:"حسابداری",desc:"سند و گزارش مالی",tag:"مالی",keys:["smart_acc_v2"]},
  {href:"cash-bank.html",icon:"🏦",bg:"linear-gradient(135deg,#14b8a6,#0f766e)",title:"نقد و بانک",desc:"دریافت، پرداخت، مغایرت",tag:"خزانه",keys:["smart_cash_v2","smart_cash_v1"]},
  {href:"petty-cash.html",icon:"💵",bg:"linear-gradient(135deg,#f97316,#c2410c)",title:"تنخواه",desc:"شارژ، هزینه، تسویه",tag:"تنخواه",keys:["smart_petty_v2","smart_petty_v1"]},
  {href:"hr-payroll.html",icon:"👥",bg:"linear-gradient(135deg,#a78bfa,#6d28d9)",title:"منابع انسانی و حقوق",desc:"پرسنل، حضور، حقوق، بیمه",tag:"HR",keys:["smart_hr_v2","smart_hr_v1"]}
];
function fileOk(href, cb){
  fetch(href,{method:"HEAD",cache:"no-store"}).then(function(r){cb(r.ok);}).catch(function(){cb(false);});
}
function hasData(keys){
  try{for(var i=0;i<keys.length;i++){if(localStorage.getItem(keys[i]))return true;}}catch(e){}
  return false;
}
var grid=document.getElementById("grid"), left=MODULES.length, miss=0, dataN=0;
MODULES.forEach(function(m){
  var a=document.createElement("a");
  a.className="card"; a.href=m.href;
  a.innerHTML='<div class="icon" style="background:'+m.bg+'">'+m.icon+'</div><h2>'+m.title+'</h2><p>'+m.desc+'</p><span class="tag miss" data-tag>بررسی فایل…</span>';
  grid.appendChild(a);
  var tag=a.querySelector("[data-tag]");
  fileOk(m.href, function(ok){
    left--;
    if(!ok){ miss++; tag.className="tag miss"; tag.textContent=m.tag+" · فایل نیست ✗"; }
    else if(hasData(m.keys)){ dataN++; tag.className="tag ok"; tag.textContent=m.tag+" · آماده ✓"; }
    else { tag.className="tag ok"; tag.textContent=m.tag+" · فایل OK"; }
    if(left===0){
      document.getElementById("status").textContent=MODULES.length+" ماژول · "+(MODULES.length-miss)+" فایل موجود · "+miss+" مفقود · "+dataN+" با داده";
    }
  });
});
})();
</script>
</body>
</html>
