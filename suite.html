<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1220">
<meta name="description" content="سوییت هوشمند — لانچر + مغز + مرکز داده">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="Referrer-Policy" content="no-referrer">
<meta http-equiv="Permissions-Policy" content="microphone=(self), geolocation=()">
<title>سوییت هوشمند | لانچر · مغز · مرکز داده</title>
<style>
:root{--bg:#0b1220;--card:rgba(30,41,59,.94);--line:#334155;--txt:#e2e8f0;--muted:#94a3b8;--pri:#0ea5e9;--ok:#22c55e;--bad:#ef4444;--warn:#f59e0b;--vio:#8b5cf6}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tahoma,"Segoe UI",system-ui,sans-serif;background:radial-gradient(900px 480px at 85% -10%,#1e3a5f 0%,transparent 55%),linear-gradient(160deg,#0b1220,#0f172a 55%,#111827);color:var(--txt);min-height:100dvh;padding:10px;text-align:right}
.wrap{max-width:1180px;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.brand{display:flex;align-items:center;gap:8px}
.brand .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#0ea5e9,#6366f1);display:grid;place-items:center;font-size:16px}
.brand h1{font-size:.9rem}.brand p{font-size:.65rem;color:var(--muted)}
.clock-box{background:rgba(15,23,42,.85);border:1px solid var(--line);border-radius:10px;padding:6px 10px;min-width:120px}
.clock-box .j{color:#7dd3fc;font-weight:800;font-size:.72rem}
.clock-box .g{color:var(--muted);font-size:.62rem;direction:ltr;unicode-bidi:isolate}
.clock-box .c{color:#86efac;font-weight:700;font-size:.7rem}
.mode-tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.mode-tabs button{border:1px solid var(--line);background:#1e293b;color:#cbd5e1;border-radius:999px;padding:6px 11px;font-weight:800;font-size:.7rem;cursor:pointer;font-family:inherit}
.mode-tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.mode-tabs button.brain-on{background:linear-gradient(135deg,#8b5cf6,#6d28d9);border-color:transparent;color:#fff}
.mode-tabs button.data-on{background:linear-gradient(135deg,#0ea5e9,#0369a1);border-color:transparent;color:#fff}
.view{display:none}.view.on{display:block}
.hero{text-align:center;padding:2px 4px 6px}
.hero h2{font-size:.92rem;margin-bottom:2px}.hero p{color:var(--muted);font-size:.7rem}
.section{margin-bottom:8px}
.section h3{font-size:.74rem;color:#7dd3fc;margin-bottom:5px;padding-bottom:3px;border-bottom:1px solid rgba(125,211,252,.25)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.mod{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 5px;text-align:center;transition:.12s;position:relative;font:inherit;cursor:pointer;width:100%}
.mod:hover{border-color:var(--pri);transform:translateY(-1px)}
.mod .ic{font-size:1.05rem;margin-bottom:2px;line-height:1}.mod .nm{font-size:.65rem;font-weight:700}.mod .ds{font-size:.52rem;color:var(--muted);margin-top:1px}
.mod .tag{position:absolute;top:3px;left:3px;font-size:.48rem;padding:1px 4px;border-radius:999px;background:rgba(14,165,233,.18);color:#7dd3fc;font-weight:700}
.card{background:rgba(15,23,42,.8);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.card h2{font-size:.78rem;color:#c4b5fd;margin-bottom:6px}
.kpi{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px;margin-bottom:8px}
.kpi .box{background:rgba(15,23,42,.9);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.kpi .n{font-size:.95rem;font-weight:800;color:#c4b5fd}.kpi .l{font-size:.55rem;color:var(--muted)}
.list-box{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:5px;background:#0f172a}
.list-box.tall{max-height:380px}
.list-item{padding:6px;border-bottom:1px solid var(--line);font-size:.7rem;border-radius:6px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
@media(max-width:800px){.row{grid-template-columns:1fr}}
label{display:block;font-size:.64rem;color:var(--muted);margin:4px 0 2px}
input,select,textarea{width:100%;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:rgba(15,23,42,.92);color:var(--txt);font-family:inherit;font-size:.78rem}
.btn{border:none;border-radius:10px;padding:7px 10px;font-weight:700;font-size:.7rem;cursor:pointer;font-family:inherit;background:#1e293b;color:#e2e8f0;border:1px solid var(--line)}
.btn-p{background:linear-gradient(135deg,#0ea5e9,#2563eb);color:#fff;border:none}
.btn-ok{background:linear-gradient(135deg,#22c55e,#15803d);color:#fff;border:none}
.btn-b{background:#7f1d1d;color:#fecaca;border:1px solid #991b1b}
.btn-w{background:#92400e;color:#fde68a;border:1px solid #b45309}
.btn-v{background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;border:none}
.btn-sm{padding:4px 7px;font-size:.64rem;border-radius:7px}
.note{font-size:.66rem;color:var(--muted);line-height:1.4;margin-top:5px}
.scope{background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.35);color:#c4b5fd;border-radius:10px;padding:8px;font-size:.68rem;margin-bottom:8px;line-height:1.5}
.warn{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.35);color:#fde68a;border-radius:10px;padding:8px;font-size:.68rem;margin-bottom:8px;line-height:1.45}
.secure{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:#86efac;border-radius:10px;padding:8px;font-size:.68rem;margin-bottom:8px;line-height:1.45}
.info{background:rgba(14,165,233,.1);border:1px solid rgba(14,165,233,.35);color:#7dd3fc;border-radius:10px;padding:8px;font-size:.68rem;margin-bottom:8px;line-height:1.45}
.empty{color:var(--muted);font-size:.7rem}
.toast{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:var(--ok);color:#fff;padding:8px 12px;border-radius:10px;font-weight:700;opacity:0;z-index:200;transition:.15s;font-size:.75rem}
.toast.show{opacity:1}.toast.err{background:var(--bad)}
.login-mask{position:fixed;inset:0;background:rgba(2,6,23,.96);z-index:300;display:flex;align-items:center;justify-content:center}
.login-box{background:#1e293b;border:1px solid var(--line);border-radius:14px;padding:16px;width:min(340px,92vw)}
table{width:100%;border-collapse:collapse;font-size:.66rem}
th,td{border-bottom:1px solid var(--line);padding:4px 3px;text-align:right}th{color:#c4b5fd}
.badge{display:inline-block;padding:1px 6px;border-radius:999px;font-size:.58rem;font-weight:700}
.badge-ok{background:rgba(34,197,94,.2);color:#86efac}
.badge-w{background:rgba(245,158,11,.2);color:#fde68a}
.badge-b{background:rgba(239,68,68,.2);color:#fecaca}
.chk{display:flex;align-items:center;gap:6px;font-size:.68rem;color:var(--muted);margin:5px 0}
pre.detail{white-space:pre-wrap;word-break:break-word;background:#020617;border:1px solid var(--line);border-radius:10px;padding:8px;font-size:.64rem;max-height:220px;overflow:auto;color:#cbd5e1;direction:ltr;text-align:left}
.form-actions{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
</style>
</head>
<body>
<p>FULL_FILE_PENDING_JS</p>
<script>console.log('suite-loading');</script>
</body>
</html>
