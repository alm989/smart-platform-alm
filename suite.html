<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<title>سامانه هوشمند یکپارچه</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tahoma,system-ui,sans-serif;background:radial-gradient(1000px 500px at 80% -20%,#1e3a5f 0%,transparent 50%),#0f172a;color:#e2e8f0;min-height:100vh;padding:24px 16px}
.wrap{max-width:960px;margin:0 auto}
h1{text-align:center;font-size:1.4rem;margin-bottom:6px}
.sub{text-align:center;color:#94a3b8;font-size:.85rem;margin-bottom:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.card{background:rgba(30,41,59,.9);border:1px solid #334155;border-radius:16px;padding:18px;text-decoration:none;color:inherit;display:block;transition:.15s}
.card:hover{transform:translateY(-3px);border-color:#fb923c}
.icon{font-size:1.8rem;margin-bottom:8px}
.card h2{font-size:.95rem;margin-bottom:6px}
.card p{font-size:.78rem;color:#94a3b8;line-height:1.45}
.tag{display:inline-block;margin-top:8px;font-size:.65rem;padding:3px 8px;border-radius:999px;background:#7c2d12;color:#fed7aa}
.foot{text-align:center;margin-top:28px;font-size:.72rem;color:#64748b}
</style>
</head>
<body>
<div class="wrap">
  <h1>سامانه هوشمند یکپارچه</h1>
  <p class="sub">منشی · حسابداری · نقد و بانک · تنخواه · منابع انسانی</p>
  <div class="grid">
    <a class="card" href="index.html"><div class="icon">🤖</div><h2>منشی</h2><p>یادآوری و جلسات</p><span class="tag">اداری</span></a>
    <a class="card" href="accounting.html"><div class="icon">📒</div><h2>حسابداری</h2><p>سند و گزارش</p><span class="tag">مالی</span></a>
    <a class="card" href="cash-bank.html"><div class="icon">🏦</div><h2>نقد و بانک</h2><p>دریافت و پرداخت</p><span class="tag">خزانه</span></a>
    <a class="card" href="petty-cash.html"><div class="icon">💵</div><h2>تنخواه</h2><p>شارژ، هزینه، تسویه</p><span class="tag">تنخواه</span></a>
    <a class="card" href="hr-payroll.html"><div class="icon">👥</div><h2>منابع انسانی</h2><p>حقوق و حضور</p><span class="tag">HR</span></a>
  </div>
  <p class="foot">یک مرورگر · localStorage مشترک</p>
</div>
</body>
</html>
