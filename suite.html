<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'">
<title>سامانه هوشمند یکپارچه — Suite</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tahoma,system-ui,sans-serif;background:radial-gradient(1100px 520px at 70% -20%,#1e3a5f 0%,transparent 45%),#0f172a;color:#e2e8f0;min-height:100dvh;padding:20px 14px 40px}
.wrap{max-width:1180px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:8px}
.brand{display:flex;align-items:center;gap:12px}
.brand-logo{width:48px;height:48px;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,#0ea5e9,#0369a1);display:grid;place-items:center}
.brand-logo img{width:100%;height:100%;object-fit:contain;background:#0f172a}
.brand-logo .em{font-size:22px}
h1{font-size:1.15rem}
.sub{color:#94a3b8;font-size:.8rem}
#status{font-size:.74rem;color:#94a3b8;margin:10px 0 12px}
.sec{font-size:.78rem;color:#7dd3fc;margin:16px 0 8px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.card{background:rgba(30,41,59,.95);border:1px solid #334155;border-radius:16px;padding:13px;text-decoration:none;color:inherit;display:flex;flex-direction:column;min-height:118px;transition:.15s}
.card:hover{transform:translateY(-3px);border-color:#38bdf8}
.card.off{opacity:.35;pointer-events:none;filter:grayscale(.85)}
.icon{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:16px;margin-bottom:6px}
.card h2{font-size:.78rem;margin-bottom:3px;line-height:1.3}
.card p{font-size:.64rem;color:#94a3b8;flex:1}
.tag{display:inline-block;margin-top:5px;font-size:.54rem;padding:2px 6px;border-radius:999px;background:#0c4a6e;color:#7dd3fc}
.btn{padding:8px 14px;border-radius:10px;border:1px solid #334155;background:#1e293b;color:#e2e8f0;font-size:.78rem;text-decoration:none;display:inline-block}
.btn-p{background:linear-gradient(135deg,#0ea5e9,#0369a1);border:none;color:#fff;font-weight:700}
.foot{text-align:center;margin-top:22px;font-size:.66rem;color:#64748b}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <div class="brand-logo" id="brandLogo"><span class="em">🧩</span></div>
      <div><h1 id="orgTitle">سامانه هوشمند یکپارچه</h1><p class="sub" style="margin:0">کatalog کامل ماژول‌ها</p></div>
    </div>
    <a class="btn btn-p" href="control-center.html">🎛️ مرکز کنترل</a>
  </div>
  <p id="status">بارگذاری…</p>
  <div id="sections"></div>
  <p class="foot">Suite کامل</p>
</div>
<script>
(function(){
"use strict";
var REG="smart_suite_registry_v1", BRAND="smart_brand_v1";
var CATALOG=[
  {id:"manager",file:"manager.html",title:"مدیر هوشمند",desc:"هماهنگی و مدیرعامل",icon:"👔",color:"#4f46e5",tag:"راهبری",group:"مدیریت"},
  {id:"control",file:"control-center.html",title:"مرکز کنترل",desc:"کاربر و لوگو",icon:"🎛️",color:"#0369a1",tag:"سامانه",group:"مدیریت"},
  {id:"security",file:"system-security.html",title:"امنیت و پایداری",desc:"ممیزی و خطا",icon:"🛡️",color:"#b91c1c",tag:"امنیت",group:"مدیریت"},
  {id:"db",file:"secure-db.html",title:"پایگاه داده امن",desc:"IndexedDB+AES",icon:"🗄️",color:"#0e7490",tag:"داده",group:"مدیریت"},
  {id:"holding",file:"holding.html",title:"چندشرکتی",desc:"هلدینگ و شعب",icon:"🏛️",color:"#1e40af",tag:"ساختار",group:"مدیریت"},

  {id:"secretary",file:"index.html",title:"منشی هوشمند",desc:"جلسه و یادآوری",icon:"🤖",color:"#0284c7",tag:"اداری",group:"اداری"},
  {id:"assistant",file:"assistant.html",title:"دستیار هوشمند",desc:"تحلیل و پیشنهاد",icon:"🧠",color:"#6d28d9",tag:"هوش",group:"اداری"},
  {id:"documents",file:"documents.html",title:"مدیریت اسناد",desc:"نامه و بایگانی",icon:"📄",color:"#475569",tag:"دبیرخانه",group:"اداری"},
  {id:"contracts",file:"contracts.html",title:"قراردادها",desc:"ثبت و پیگیری",icon:"📝",color:"#64748b",tag:"حقوقی",group:"اداری"},
  {id:"pr",file:"pr-media.html",title:"روابط عمومی",desc:"رسانه و محتوا",icon:"📢",color:"#db2777",tag:"PR",group:"اداری"},
  {id:"lawyer",file:"lawyer.html",title:"وکیل هوشمند",desc:"پرونده قضایی",icon:"⚖️",color:"#1e40af",tag:"حقوقی",group:"اداری"},
  {id:"projects",file:"projects.html",title:"مدیریت پروژه",desc:"پیشرفت و بودجه",icon:"📁",color:"#2563eb",tag:"پروژه",group:"اداری"},

  {id:"accounting",file:"accounting.html",title:"حسابداری",desc:"سند و تراز",icon:"📒",color:"#047857",tag:"مالی",group:"مالی"},
  {id:"bank",file:"cash-bank.html",title:"نقد و بانک",desc:"دریافت و مغایرت",icon:"🏦",color:"#0f766e",tag:"بانک",group:"مالی"},
  {id:"fund",file:"fund.html",title:"صندوق",desc:"نقد و اوراق",icon:"🗃️",color:"#b45309",tag:"صندوق",group:"مالی"},
  {id:"petty",file:"petty-cash.html",title:"تنخواه",desc:"هزینه جاری",icon:"💵",color:"#c2410c",tag:"تنخواه",group:"مالی"},
  {id:"assets",file:"fixed-assets.html",title:"دارایی ثابت",desc:"استهلاک",icon:"🏢",color:"#7c3aed",tag:"دارایی",group:"مالی"},
  {id:"budget",file:"budget.html",title:"بودجه",desc:"مصوب و مصرف",icon:"📊",color:"#0d9488",tag:"بودجه",group:"مالی"},
  {id:"tax",file:"tax.html",title:"مالیات",desc:"VAT و عملکرد",icon:"🧾",color:"#b45309",tag:"مالیات",group:"مالی"},

  {id:"sales",file:"sales.html",title:"فروش",desc:"فاکتور",icon:"🛒",color:"#0369a1",tag:"فروش",group:"عملیات"},
  {id:"warehouse",file:"warehouse.html",title:"خرید و انبار",desc:"موجودی",icon:"📦",color:"#0d9488",tag:"انبار",group:"عملیات"},
  {id:"production",file:"production.html",title:"تولید",desc:"بهای تمام‌شده",icon:"🏭",color:"#7c3aed",tag:"تولید",group:"عملیات"},
  {id:"customers",file:"customers.html",title:"مشتریان",desc:"CRM",icon:"👤",color:"#1d4ed8",tag:"CRM",group:"عملیات"},
  {id:"hr",file:"hr-payroll.html",title:"منابع انسانی",desc:"حقوق و حضور",icon:"👥",color:"#6d28d9",tag:"HR",group:"عملیات"},
  {id:"fleet",file:"fleet.html",title:"ناوگان",desc:"وسایل و حمل",icon:"🚚",color:"#c2410c",tag:"حمل",group:"عملیات"}
];
var GROUP_ORDER=["مدیریت","اداری","مالی","عملیات"];
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML;}
function loadBrand(){try{return JSON.parse(localStorage.getItem(BRAND)||"null");}catch(e){return null;}}
function loadReg(){try{return JSON.parse(localStorage.getItem(REG)||"null");}catch(e){return null;}}
function applyBrand(){
  var b=loadBrand(),reg=loadReg();
  var logo=(b&&b.logo)||(reg&&reg.logo)||null;
  var name=(b&&b.name)||(reg&&reg.org)||"";
  var el=document.getElementById("brandLogo");
  if(logo) el.innerHTML='<img src="'+logo+'" alt="logo">';
  else el.innerHTML='<span class="em">🧩</span>';
  if(name) document.getElementById("orgTitle").textContent=name;
}
function render(){
  applyBrand();
  var reg=loadReg(), enabled={};
  if(reg&&Array.isArray(reg.modules)) reg.modules.forEach(function(m){enabled[m.id]=m.enabled!==false;});
  CATALOG.forEach(function(m){if(enabled[m.id]===undefined)enabled[m.id]=true;});
  document.getElementById("status").textContent="تعداد ماژول: "+CATALOG.length+(reg?" · رجیستری فعال":" · همه فعال");
  var root=document.getElementById("sections"); root.textContent="";
  GROUP_ORDER.forEach(function(g){
    var items=CATALOG.filter(function(m){return m.group===g;});
    if(!items.length)return;
    var h=document.createElement("div"); h.className="sec"; h.textContent=g; root.appendChild(h);
    var grid=document.createElement("div"); grid.className="grid";
    items.forEach(function(m){
      var on=enabled[m.id]!==false;
      var a=document.createElement("a");
      a.className="card"+(on?"":" off");
      a.href=on?m.file:"#";
      if(on){a.target="_blank";a.rel="noopener";}
      a.innerHTML='<div class="icon" style="background:'+m.color+'">'+m.icon+'</div><h2>'+esc(m.title)+'</h2><p>'+esc(m.desc)+'</p><span class="tag">'+esc(m.tag)+'</span>';
      grid.appendChild(a);
    });
    root.appendChild(grid);
  });
}
render();
window.addEventListener("storage",function(e){if(e.key===REG||e.key===BRAND)render();});
})();
</script>
</body>
</html>
