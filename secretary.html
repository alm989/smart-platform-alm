<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منشی هوشمند</title>
<style>
:root{--bg:#0b1220;--panel:#111827;--card:#1a2332;--line:#2d3a4f;--txt:#e8eef7;--muted:#94a3b8;--pri:#3b82f6;--pri-dim:rgba(59,130,246,.18);--ok:#22c55e;--bad:#ef4444;--glass:rgba(17,24,39,.98);--shadow:0 12px 32px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tahoma,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100dvh;line-height:1.55}
.app-shell{display:grid;grid-template-columns:260px 1fr;grid-template-rows:auto 1fr auto;min-height:100dvh}
@media(max-width:960px){.app-shell{grid-template-columns:1fr}.side-panel{display:none}.side-panel.open{display:block;position:fixed;inset:0 auto 0 0;right:0;width:min(300px,92vw);z-index:80;background:var(--panel);border-left:1px solid var(--line);overflow:auto}}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:64px;background:#0f172a;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#60a5fa,#1d4ed8);display:grid;place-items:center;font-size:18px}
.brand h1{font-size:.9rem;font-weight:800;color:#f1f5f9}
.mega{display:flex;align-items:center;gap:4px;flex:1;justify-content:center;flex-wrap:wrap}
.mega-item{position:relative}
.mega-item>.mega-btn{background:#1e293b;border:1px solid var(--line);color:#cbd5e1;border-radius:8px;padding:8px 12px;font-size:.78rem;font-weight:700;cursor:pointer;font-family:inherit}
.mega-item.open>.mega-btn,.mega-item:hover>.mega-btn{background:var(--pri);color:#fff;border-color:var(--pri)}
.mega-item .drop{position:absolute;top:calc(100% + 4px);right:0;min-width:180px;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:6px;z-index:60;box-shadow:var(--shadow);display:none}
.mega-item.open .drop,.mega-item:hover .drop{display:block}
.mega-item .drop button{display:block;width:100%;text-align:right;background:transparent;border:none;color:var(--txt);padding:9px 12px;border-radius:8px;font-size:.8rem;cursor:pointer;font-family:inherit}
.mega-item .drop button:hover{background:var(--pri-dim);color:#93c5fd}
.btn-exit{background:linear-gradient(135deg,#f87171,#dc2626);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:.75rem;font-weight:800;cursor:pointer;font-family:inherit}
.header-left{display:flex;align-items:center;gap:10px;flex-shrink:0}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt);cursor:pointer;font-size:16px}
.icon-btn.mic-on{background:rgba(34,197,94,.2);border-color:#22c55e;color:#22c55e}
.icon-btn.mic-off{background:rgba(239,68,68,.15);border-color:#ef4444;color:#ef4444}
/* FIXED header clock - solid text, not colored lines */
.header-clock{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:6px 12px;border-radius:10px;background:#1e293b;border:1px solid var(--line);min-width:140px;min-height:56px}
.header-clock span{display:block;font-size:12px;font-weight:700;line-height:1.35;white-space:nowrap;color:#e2e8f0}
.header-clock .j{color:#7dd3fc !important}
.header-clock .g{color:#94a3b8 !important;direction:ltr;unicode-bidi:isolate;font-size:11px}
.header-clock .c{color:#86efac !important}
.header-clock .u{color:#fcd34d !important;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.side-panel{grid-row:2;grid-column:1;border-left:1px solid var(--line);background:var(--panel);padding:12px 10px;overflow:auto}
.side-panel h3{font-size:.75rem;color:#7dd3fc;margin-bottom:10px;font-weight:800}
.tree details{margin-bottom:6px}
.tree summary{cursor:pointer;padding:9px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:.8rem;font-weight:700;list-style:none;color:#e2e8f0}
.tree summary::-webkit-details-marker{display:none}
.tree details[open]>summary{background:var(--pri-dim);border-color:rgba(59,130,246,.5);color:#93c5fd}
.tree .leaf{display:block;width:100%;text-align:right;background:transparent;border:none;color:#94a3b8;padding:8px 12px;font-size:.78rem;cursor:pointer;font-family:inherit;border-radius:8px}
.tree .leaf:hover,.tree .leaf.on{background:rgba(59,130,246,.15);color:#f1f5f9}
.main{grid-row:2;grid-column:2;padding:14px;overflow:auto}
@media(max-width:960px){.main{grid-column:1}}
.statusbar{grid-column:1/-1;padding:8px 14px;border-top:1px solid var(--line);font-size:.72rem;color:var(--muted);display:flex;justify-content:space-between}
.panel{display:none}.panel.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:.95rem;margin-bottom:10px;color:#f1f5f9}
label{display:block;font-size:.72rem;color:var(--muted);margin:8px 0 4px}
input,select,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:#0f172a;color:var(--txt);font-family:inherit;font-size:14px}
input.err{border-color:var(--bad)}.field-error{color:#fca5a5;font-size:.7rem;min-height:1em}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.row{grid-template-columns:1fr}}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{border:none;border-radius:10px;padding:9px 14px;font-weight:700;font-size:.8rem;cursor:pointer;font-family:inherit}
.btn-p{background:linear-gradient(135deg,#60a5fa,#2563eb);color:#fff}
.btn-g{background:#334155;color:#e2e8f0}
.btn-b{background:var(--bad);color:#fff}
.btn-sm{padding:5px 10px;font-size:.72rem}
table{width:100%;border-collapse:collapse;font-size:.8rem}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:right}
th{color:#7dd3fc;font-size:.72rem}
.empty{color:var(--muted);font-size:.85rem;padding:8px 0}
.kpi{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-bottom:12px}
.kpi .box{background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.3);border-radius:12px;padding:12px}
.kpi .n{font-size:1.25rem;font-weight:800;color:#7dd3fc}.kpi .l{font-size:.7rem;color:var(--muted)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ok);color:#052e16;padding:10px 16px;border-radius:12px;font-weight:700;opacity:0;transition:.2s;z-index:100}
.toast.show{opacity:1}.toast.err{background:var(--bad);color:#fff}
.date-wrap{position:relative}
.jcal-pop{position:absolute;z-index:90;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:12px;width:300px;box-shadow:var(--shadow)}
.jcal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.jcal-head button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:#0f172a;color:var(--txt);cursor:pointer}
.jcal-head .title{font-size:.85rem;font-weight:800;color:#7dd3fc}
.jcal-week,.jcal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.jcal-week span{text-align:center;font-size:.6rem;color:var(--muted)}
.jcal-days button{border:none;background:transparent;color:var(--txt);border-radius:8px;padding:4px;cursor:pointer;font-family:inherit;min-height:44px}
.jcal-days button .jd{display:block;font-size:.8rem;font-weight:700}
.jcal-days button .gd{display:block;font-size:.55rem;color:var(--muted)}
.jcal-days button:hover{background:#334155}
.suite-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.suite-grid a{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;color:inherit;text-align:center}
.suite-grid a:hover{border-color:#38bdf8}
.suite-grid .ic{font-size:1.5rem;margin-bottom:6px}
.suite-grid .t{font-size:.8rem;font-weight:700}
.cat{margin:18px 0 8px;color:#7dd3fc;font-size:.9rem;font-weight:800}
</style>
</head>
<body>
<div class="app-shell">
<header class="topbar">
  <div class="brand"><div class="logo">🤖</div><div><h1>منشی هوشمند</h1></div></div>
  <nav class="mega">
    <div class="mega-item"><div class="mega-btn">داشبورد</div><div class="drop">
      <button type="button" data-panel="p-dash">نمای کلی</button>
      <button type="button" data-panel="p-near">رویدادهای نزدیک</button>
    </div></div>
    <div class="mega-item"><div class="mega-btn">ثبت</div><div class="drop">
      <button type="button" data-panel="p-meet">ثبت جلسه</button>
      <button type="button" data-panel="p-note">ثبت یادداشت</button>
      <button type="button" data-panel="p-rem">ثبت یادآوری</button>
    </div></div>
    <div class="mega-item"><div class="mega-btn">فهرست</div><div class="drop">
      <button type="button" data-panel="p-list">همه موارد</button>
    </div></div>
    <div class="mega-item"><div class="mega-btn">گزارش‌ها</div><div class="drop">
      <button type="button" data-panel="p-rep">خلاصه روزانه</button>
    </div></div>
    <div class="mega-item"><div class="mega-btn">امکانات</div><div class="drop">
      <button type="button" id="btnBackup">پشتیبان JSON</button>
      <button type="button" id="btnRestoreTrigger">بازیابی</button>
    </div></div>
    <div class="mega-item"><div class="mega-btn">تنظیمات</div><div class="drop">
      <button type="button" id="btnToggleSide">منوی درختی</button>
    </div></div>
    <button type="button" class="btn-exit" id="btnExit">خروج به Suite</button>
  </nav>
  <div class="header-left">
    <button type="button" class="icon-btn mic-off" id="btnMic" title="تایپ صوتی">🎤</button>
    <div class="header-clock">
      <span class="j" id="dtJ">—</span>
      <span class="g" id="dtG">—</span>
      <span class="c" id="dtC">—</span>
      <span class="u" id="activeUser">—</span>
    </div>
  </div>
</header>
<aside class="side-panel" id="sidePanel">
  <h3>ناوبری منشی</h3>
  <div class="tree">
    <details open><summary>داشبورد</summary>
      <button type="button" class="leaf on" data-panel="p-dash">نمای کلی</button>
      <button type="button" class="leaf" data-panel="p-near">رویدادهای نزدیک</button>
    </details>
    <details open><summary>ثبت</summary>
      <button type="button" class="leaf" data-panel="p-meet">جلسه</button>
      <button type="button" class="leaf" data-panel="p-note">یادداشت</button>
      <button type="button" class="leaf" data-panel="p-rem">یادآوری</button>
    </details>
    <details open><summary>فهرست</summary>
      <button type="button" class="leaf" data-panel="p-list">همه موارد</button>
    </details>
    <details><summary>گزارش‌ها</summary>
      <button type="button" class="leaf" data-panel="p-rep">خلاصه روزانه</button>
    </details>
    <details><summary>امکانات</summary>
      <button type="button" class="leaf" id="leafBackup">پشتیبان</button>
    </details>
    <details><summary>تنظیمات</summary>
      <button type="button" class="leaf" data-panel="p-dash">عمومی</button>
    </details>
  </div>
</aside>
<main class="main">
  <div class="panel on" id="p-dash">
    <div class="kpi" id="kpiBox"></div>
    <div class="card"><h2>وضعیت امروز</h2><p class="empty" id="dashNote">—</p></div>
  </div>
  <div class="panel" id="p-near">
    <div class="card"><h2>رویدادهای نزدیک (۳ روز)</h2><div id="nearBox" class="empty">—</div></div>
  </div>
  <div class="panel" id="p-meet">
    <div class="card"><h2>ثبت جلسه</h2>
      <div class="row">
        <div><label>عنوان *</label><input id="mTitle" data-validate="required" spellcheck="true"><div class="field-error"></div></div>
        <div><label>تاریخ</label><input id="mDate" class="jdate" data-jdate data-validate="date"><div class="field-error"></div></div>
      </div>
      <div class="row">
        <div><label>ساعت</label><input id="mTime" placeholder="۱۰:۳۰"></div>
        <div><label>اولویت</label><select id="mPri"><option>عادی</option><option>مهم</option><option>فوری</option></select></div>
      </div>
      <label>توضیح</label><textarea id="mNote" rows="2" spellcheck="true"></textarea>
      <div class="btns"><button type="button" class="btn btn-p" id="btnMSave">ذخیره جلسه</button></div>
    </div>
  </div>
  <div class="panel" id="p-note">
    <div class="card"><h2>ثبت یادداشت</h2>
      <label>عنوان *</label><input id="nTitle" data-validate="required" spellcheck="true"><div class="field-error"></div>
      <label>متن</label><textarea id="nBody" rows="4" spellcheck="true"></textarea>
      <div class="btns"><button type="button" class="btn btn-p" id="btnNSave">ذخیره یادداشت</button></div>
    </div>
  </div>
  <div class="panel" id="p-rem">
    <div class="card"><h2>ثبت یادآوری</h2>
      <div class="row">
        <div><label>عنوان *</label><input id="rTitle" data-validate="required" spellcheck="true"><div class="field-error"></div></div>
        <div><label>تاریخ</label><input id="rDate" class="jdate" data-jdate data-validate="date"><div class="field-error"></div></div>
      </div>
      <div class="btns"><button type="button" class="btn btn-p" id="btnRSave">ذخیره یادآوری</button></div>
    </div>
  </div>
  <div class="panel" id="p-list">
    <div class="card"><h2>فهرست</h2>
      <div class="btns" style="margin-top:0">
        <button type="button" class="btn btn-g btn-sm" data-tab="meetings">جلسات</button>
        <button type="button" class="btn btn-g btn-sm" data-tab="notes">یادداشت‌ها</button>
        <button type="button" class="btn btn-g btn-sm" data-tab="reminders">یادآوری‌ها</button>
      </div>
      <div id="listBox" style="margin-top:10px"></div>
    </div>
  </div>
  <div class="panel" id="p-rep">
    <div class="card"><h2>خلاصه</h2><div id="repBox"></div></div>
  </div>
</main>
<footer class="statusbar"><span>منشی هوشمند · secretary.html</span><span>خروج → index.html</span></footer>
</div>
<input type="file" id="restoreFile" accept="application/json" hidden>
<div class="toast" id="toast"></div>
<script>(function(g){"use strict";
var FA=["۰","۱","۲","۳","۴","۵","۶","۷","۸","۹"];
function toFa(n){return String(n).replace(/\d/g,function(d){return FA[+d];});}
function toEn(s){return String(s).replace(/[۰-۹]/g,function(d){return "۰۱۲۳۴۵۶۷۸۹".indexOf(d);});}
function g2j(gy,gm,gd){var g_d_m=[0,31,59,90,120,151,181,212,243,273,304,334];var gy2=(gm>2)?(gy+1):gy;var days=355666+365*gy+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)+gd+g_d_m[gm-1];var jy=-1595+33*Math.floor(days/12053);days%=12053;jy+=4*Math.floor(days/1461);days%=1461;if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365;}var jm=(days<186)?1+Math.floor(days/31):7+Math.floor((days-186)/30);var jd=1+((days<186)?(days%31):((days-186)%30));return {jy:jy,jm:jm,jd:jd};}

function jMonthLength(jy,jm){if(jm<=6)return 31;if(jm<=11)return 30;var a=j2g(jy,12,30);var b=g2j(a.gy,a.gm,a.gd);return (b.jy===jy&&b.jm===12&&b.jd===30)?30:29;}
var JM=["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];
var JW_FULL=["شنبه","یکشنبه","دوشنبه","سه‌شنبه","چهارشنبه","پنجشنبه","جمعه"];
function startClock(elJ,elG,elC){function tick(){var n=new Date();var j=g2j(n.getFullYear(),n.getMonth()+1,n.getDate());if(elJ)elJ.textContent=toFa(j.jy)+"/"+toFa(String(j.jm).padStart(2,"0"))+"/"+toFa(String(j.jd).padStart(2,"0"));if(elG)elG.textContent=n.getFullYear()+"/"+String(n.getMonth()+1).padStart(2,"0")+"/"+String(n.getDate()).padStart(2,"0");if(elC)elC.textContent=toFa(String(n.getHours()).padStart(2,"0"))+":"+toFa(String(n.getMinutes()).padStart(2,"0"))+":"+toFa(String(n.getSeconds()).padStart(2,"0"));}tick();setInterval(tick,1000);}
function getActiveUser(){try{var a=JSON.parse(localStorage.getItem("smart_auth_v1")||"null");if(a&&a.session&&a.session.user)return a.session.user;}catch(e){}return "کاربر محلی";}
var Validators={required:function(v){return String(v||"").trim()?null:"الزامی";},number:function(v){if(!String(v||"").trim())return null;if(!/^-?\d+(\.\d+)?$/.test(toEn(String(v)).trim()))return "فقط عدد";return null;},date:function(v){if(!String(v||"").trim())return null;if(!/^\d{4}[\/\-]\d{1,2}[\/\-]\d{1,2}$/.test(toEn(String(v)).trim()))return "تاریخ نامعتبر";return null;},code:function(v){if(!String(v||"").trim())return null;if(!/^[A-Za-z0-9._-]{1,24}$/.test(String(v).trim()))return "کد نامعتبر";return null;}};
function clearFieldError(el){el.classList.remove("err");var err=el.parentNode&&el.parentNode.querySelector(".field-error");if(err)err.textContent="";}
function bindFieldValidation(root){(root||document).querySelectorAll("[data-validate]").forEach(function(el){var types=(el.getAttribute("data-validate")||"").split(/\s+/).filter(Boolean);function run(){var val=el.value;if(!String(val||"").trim()&&types.indexOf("required")<0){clearFieldError(el);return true;}if(!String(val||"").trim()&&types.indexOf("required")>=0){el.classList.add("err");var err=el.parentNode.querySelector(".field-error");if(!err){err=document.createElement("div");err.className="field-error";el.parentNode.appendChild(err);}err.textContent="الزامی";return false;}var msg=null;for(var i=0;i<types.length;i++){var fn=Validators[types[i]];if(fn){msg=fn(val);if(msg)break;}}if(msg){el.classList.add("err");var err=el.parentNode.querySelector(".field-error");if(!err){err=document.createElement("div");err.className="field-error";el.parentNode.appendChild(err);}err.textContent=msg;return false;}clearFieldError(el);return true;}el.addEventListener("blur",run);el.addEventListener("input",run);el.addEventListener("change",run);el._validate=run;});}
function validateForm(root){var ok=true;(root||document).querySelectorAll("[data-validate]").forEach(function(el){if(el._validate&&!el._validate())ok=false;});return ok;}
function enableSpellcheck(root){(root||document).querySelectorAll("input[type=text],textarea").forEach(function(el){el.setAttribute("spellcheck","true");el.setAttribute("lang","fa");});}
var recog=null,micActive=false,micBtn=null;
function insertText(t){if(!t)return;var a=document.activeElement;if(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA")&&a.type!=="password"){var s=a.selectionStart!=null?a.selectionStart:a.value.length;var e=a.selectionEnd!=null?a.selectionEnd:s;a.value=a.value.slice(0,s)+t+a.value.slice(e);try{a.setSelectionRange(s+t.length,s+t.length);}catch(err){}a.dispatchEvent(new Event("input",{bubbles:true}));}}
function initVoice(btn){micBtn=btn;var SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){if(btn)btn.classList.add("mic-off");return;}recog=new SR();recog.lang="fa-IR";recog.continuous=false;recog.interimResults=true;recog.maxAlternatives=1;recog.onresult=function(ev){var final="";for(var i=ev.resultIndex;i<ev.results.length;i++)if(ev.results[i].isFinal)final+=ev.results[i][0].transcript;if(final)insertText(final);};recog.onerror=function(e){if(e.error!=="aborted")stopMic();};recog.onend=function(){if(micActive){try{recog.start();}catch(e){requestAnimationFrame(function(){if(micActive){try{recog.start();}catch(e2){}});}}};if(btn){btn.classList.add("mic-off");btn.onclick=function(){if(micActive)stopMic();else startMic();};}}
function startMic(){if(!recog)return;try{recog.start();micActive=true;if(micBtn){micBtn.classList.remove("mic-off");micBtn.classList.add("mic-on");}}catch(e){}}
function stopMic(){micActive=false;try{if(recog)recog.abort();}catch(e){}if(micBtn){micBtn.classList.remove("mic-on");micBtn.classList.add("mic-off");}}
function attachJalaliPicker(input){if(!input||input._jcal)return;input._jcal=true;var wrap=input.closest(".date-wrap")||input.parentNode;if(!wrap.classList.contains("date-wrap")){var w=document.createElement("div");w.className="date-wrap";input.parentNode.insertBefore(w,input);w.appendChild(input);wrap=w;}var pop=null,viewY,viewM;function close(){if(pop){pop.remove();pop=null;}document.removeEventListener("click",outside);}function outside(e){if(pop&&!pop.contains(e.target)&&e.target!==input)close();}function open(){close();var now=new Date();var j=g2j(now.getFullYear(),now.getMonth()+1,now.getDate());var cur=toEn(input.value||"");var m=cur.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);viewY=m?+m[1]:j.jy;viewM=m?+m[2]:j.jm;pop=document.createElement("div");pop.className="jcal-pop";wrap.appendChild(pop);render();setTimeout(function(){document.addEventListener("click",outside);},0);}function render(){if(!pop)return;var head=document.createElement("div");head.className="jcal-head";head.innerHTML='<button type="button" data-a="py">«</button><button type="button" data-a="pm">‹</button><span class="title">'+JM[viewM-1]+' '+toFa(viewY)+'</span><button type="button" data-a="nm">›</button><button type="button" data-a="ny">»</button>';var week=document.createElement("div");week.className="jcal-week";JW_FULL.forEach(function(w){var s=document.createElement("span");s.textContent=w;week.appendChild(s);});var days=document.createElement("div");days.className="jcal-days";var dim=jMonthLength(viewY,viewM);var firstG=j2g(viewY,viewM,1);var first=new Date(firstG.gy,firstG.gm-1,firstG.gd);var start=(first.getDay()+1)%7;for(var i=0;i<start;i++){var b0=document.createElement("button");b0.type="button";b0.className="out";b0.disabled=true;days.appendChild(b0);}for(var d=1;d<=dim;d++){(function(day){var g=j2g(viewY,viewM,day);var gFull=g.gy+"/"+String(g.gm).padStart(2,"0")+"/"+String(g.gd).padStart(2,"0");var btn=document.createElement("button");btn.type="button";btn.innerHTML='<span class="jd">'+toFa(day)+'</span><span class="gd">'+gFull+'</span>';btn.onclick=function(ev){ev.stopPropagation();input.value=toFa(viewY)+"/"+toFa(String(viewM).padStart(2,"0"))+"/"+toFa(String(day).padStart(2,"0"));input.dispatchEvent(new Event("input",{bubbles:true}));if(input._validate)input._validate();close();};days.appendChild(btn);})(d);}pop.innerHTML="";pop.appendChild(head);pop.appendChild(week);pop.appendChild(days);head.querySelectorAll("button").forEach(function(b){b.onclick=function(ev){ev.stopPropagation();var a=b.getAttribute("data-a");if(a==="pm"){viewM--;if(viewM<1){viewM=12;viewY--;}}if(a==="nm"){viewM++;if(viewM>12){viewM=1;viewY++;}}if(a==="py")viewY--;if(a==="ny")viewY++;render();};});}input.addEventListener("focus",open);input.addEventListener("click",open);}
function attachAllDatePickers(root){(root||document).querySelectorAll("input[data-jdate],input.jdate").forEach(attachJalaliPicker);}
function showPanel(id){document.querySelectorAll(".panel").forEach(function(p){p.classList.remove("on");});var el=document.getElementById(id);if(el)el.classList.add("on");document.querySelectorAll(".tree .leaf").forEach(function(b){b.classList.toggle("on",b.getAttribute("data-panel")===id);});}
function saveAndExit(saveFn,suiteUrl){try{if(typeof saveFn==="function")saveFn();}catch(e){}location.href=suiteUrl||"index.html";}
function bindMegaHover(){document.querySelectorAll(".mega-item").forEach(function(item){item.addEventListener("mouseenter",function(){document.querySelectorAll(".mega-item.open").forEach(function(o){if(o!==item)o.classList.remove("open");});item.classList.add("open");});item.addEventListener("mouseleave",function(){item.classList.remove("open");});});}
function bootShell(opts){opts=opts||{};startClock(document.getElementById("dtJ"),document.getElementById("dtG"),document.getElementById("dtC"));var u=document.getElementById("activeUser");if(u)u.textContent=getActiveUser();enableSpellcheck(document);bindFieldValidation(document);attachAllDatePickers(document);initVoice(document.getElementById("btnMic"));bindMegaHover();document.querySelectorAll("[data-panel]").forEach(function(b){b.addEventListener("click",function(e){e.preventDefault();showPanel(b.getAttribute("data-panel"));document.querySelectorAll(".mega-item.open").forEach(function(o){o.classList.remove("open");});});});var sb=document.getElementById("btnToggleSide");if(sb)sb.onclick=function(){var s=document.getElementById("sidePanel");if(s)s.classList.toggle("open");};var ex=document.getElementById("btnExit");if(ex)ex.onclick=function(){saveAndExit(opts.onSave,opts.suiteUrl||"index.html");};}
g.ModuleKit={toFa:toFa,toEn:toEn,bootShell:bootShell,validateForm:validateForm,startClock:startClock,getActiveUser:getActiveUser};
})(window);
</script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var KEY = "smart_secretary_v1", K = ModuleKit, tab = "meetings", tt = null;
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function esc(s) { var d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; }
  function toast(m, e) { var t = document.getElementById("toast"); t.textContent = m; t.classList.toggle("err", !!e); t.classList.add("show"); clearTimeout(tt); tt = setTimeout(function () { t.classList.remove("show"); }, 2200); }
  function load() {
    try {
      var d = JSON.parse(localStorage.getItem(KEY) || "null");
      if (!d) return { meetings: [], notes: [], reminders: [] };
      d.meetings = d.meetings || []; d.notes = d.notes || []; d.reminders = d.reminders || [];
      return d;
    } catch (e) { return { meetings: [], notes: [], reminders: [] }; }
  }
  function save(d) { d.updated = new Date().toISOString(); localStorage.setItem(KEY, JSON.stringify(d)); }
  K.bootShell({ onSave: function () { save(load()); }, suiteUrl: "index.html" });

  function renderDash() {
    var d = load();
    document.getElementById("kpiBox").innerHTML =
      '<div class="box"><div class="n">' + d.meetings.length + '</div><div class="l">جلسه</div></div>' +
      '<div class="box"><div class="n">' + d.notes.length + '</div><div class="l">یادداشت</div></div>' +
      '<div class="box"><div class="n">' + d.reminders.length + '</div><div class="l">یادآوری</div></div>';
    document.getElementById("dashNote").textContent =
      "جلسات فعال: " + d.meetings.length + " | یادداشت: " + d.notes.length + " | یادآوری: " + d.reminders.length;
  }
  function renderNear() {
    var d = load();
    var items = d.meetings.concat(d.reminders).filter(function (x) { return x.date; });
    document.getElementById("nearBox").innerHTML = items.length
      ? "<table><thead><tr><th>عنوان</th><th>تاریخ</th></tr></thead><tbody>" +
        items.map(function (x) { return "<tr><td>" + esc(x.title) + "</td><td>" + esc(x.date) + "</td></tr>"; }).join("") +
        "</tbody></table>"
      : '<p class="empty">رویدادی نیست</p>';
  }
  function renderList() {
    var d = load(), box = document.getElementById("listBox"), arr = d[tab] || [];
    if (!arr.length) { box.innerHTML = '<p class="empty">خالی</p>'; return; }
    box.innerHTML = "<table><thead><tr><th>عنوان</th><th>تاریخ</th><th></th></tr></thead><tbody>" +
      arr.map(function (x) {
        return "<tr><td>" + esc(x.title) + "</td><td>" + esc(x.date || "") + "</td><td><button type=\"button\" class=\"btn btn-b btn-sm\" data-id=\"" + esc(x.id) + "\">حذف</button></td></tr>";
      }).join("") + "</tbody></table>";
    box.querySelectorAll("[data-id]").forEach(function (b) {
      b.onclick = function () {
        var d = load();
        d[tab] = (d[tab] || []).filter(function (x) { return x.id !== b.getAttribute("data-id"); });
        save(d); renderAll(); toast("حذف شد");
      };
    });
  }
  function renderRep() {
    var d = load();
    document.getElementById("repBox").innerHTML =
      "<p>تعداد جلسات: " + d.meetings.length + "</p><p>یادداشت‌ها: " + d.notes.length + "</p><p>یادآوری‌ها: " + d.reminders.length + "</p>";
  }
  function renderAll() { renderDash(); renderNear(); renderList(); renderRep(); }

  document.getElementById("btnMSave").onclick = function () {
    if (!K.validateForm(document.getElementById("p-meet"))) { toast("خطای فرم", true); return; }
    var d = load();
    d.meetings.unshift({ id: uid(), title: document.getElementById("mTitle").value.trim(), date: document.getElementById("mDate").value.trim(), time: document.getElementById("mTime").value.trim(), pri: document.getElementById("mPri").value, note: document.getElementById("mNote").value.trim() });
    save(d); ["mTitle","mDate","mTime","mNote"].forEach(function (i) { document.getElementById(i).value = ""; });
    renderAll(); toast("جلسه ذخیره شد");
  };
  document.getElementById("btnNSave").onclick = function () {
    if (!K.validateForm(document.getElementById("p-note"))) { toast("خطای فرم", true); return; }
    var d = load();
    d.notes.unshift({ id: uid(), title: document.getElementById("nTitle").value.trim(), body: document.getElementById("nBody").value.trim() });
    save(d); document.getElementById("nTitle").value = ""; document.getElementById("nBody").value = "";
    renderAll(); toast("یادداشت ذخیره شد");
  };
  document.getElementById("btnRSave").onclick = function () {
    if (!K.validateForm(document.getElementById("p-rem"))) { toast("خطای فرم", true); return; }
    var d = load();
    d.reminders.unshift({ id: uid(), title: document.getElementById("rTitle").value.trim(), date: document.getElementById("rDate").value.trim() });
    save(d); document.getElementById("rTitle").value = ""; document.getElementById("rDate").value = "";
    renderAll(); toast("یادآوری ذخیره شد");
  };
  document.querySelectorAll("[data-tab]").forEach(function (b) {
    b.onclick = function () { tab = b.getAttribute("data-tab"); renderList(); };
  });
  function doBackup() {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(load(), null, 2)], { type: "application/json" }));
    a.download = "secretary-backup.json"; a.click(); toast("دانلود شد");
  }
  document.getElementById("btnBackup").onclick = doBackup;
  document.getElementById("leafBackup").onclick = doBackup;
  document.getElementById("btnRestoreTrigger").onclick = function () { document.getElementById("restoreFile").click(); };
  document.getElementById("restoreFile").onchange = function (e) {
    var f = e.target.files && e.target.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try { var d = JSON.parse(r.result); save(d); renderAll(); toast("بازیابی شد"); }
      catch (err) { toast("نامعتبر", true); }
    };
    r.readAsText(f);
  };
  renderAll();
});
</script>
</body>
